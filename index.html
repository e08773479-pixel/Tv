<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOKER - Pro Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #030008;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الحاوية الكبرى - Fullscreen */
        .joker-viewport {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 30%, #2e0854 0%, #110326 50%, #030008 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* خلفية الإضاءة المتحركة والتأثيرات */
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(217, 70, 239, 0.1) 50%, transparent 70%);
            top: 10%;
            border-radius: 50%;
            filter: blur(60px);
            animation: pulseGlow 4s infinite alternate;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* 1. شعار اللعبة الفخم */
        .brand-header {
            text-align: center;
            margin-top: 15px;
            z-index: 5;
        }

        .joker-avatar-frame {
            width: 75px;
            height: 75px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #a855f7, #facc15);
            border-radius: 50%;
            padding: 3px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
            animation: float 3.5s ease-in-out infinite;
        }

        .joker-avatar-inner {
            width: 100%;
            height: 100%;
            background: #0d021a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
        }

        .brand-title {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff 0%, #d8b4fe 40%, #a855f7 70%, #581c87 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        .brand-subtitle {
            font-size: 11px;
            color: #facc15;
            letter-spacing: 3px;
            font-weight: 800;
            text-transform: uppercase;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 2. صندوق الدخول الاحترافي (Glassmorphism) */
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: rgba(19, 7, 36, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(168, 85, 247, 0.15);
            z-index: 5;
        }

        /* أزرار التبديل الدخول / الحساب الجديد */
        .auth-tabs {
            display: flex;
            background: #0a0314;
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            background: transparent;
            border: none;
            color: #a855f7;
            padding: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        /* حقول الإدخال */
        .field-group {
            margin-bottom: 14px;
            text-align: right;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            color: #d8b4fe;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-group input, .field-group select {
            width: 100%;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid #3b0764;
            background: rgba(10, 3, 20, 0.9);
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .field-group input:focus, .field-group select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
            background: #120524;
        }

        /* زر الدخول الرئيسي */
        .submit-action-btn {
            width: 100%;
            background: linear-gradient(90deg, #a855f7, #d946ef);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.5);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .submit-action-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(168, 85, 247, 0.3);
        }

        /* حالة السيرفر بالأسفل */
        .server-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: #4ade80;
            margin-top: 14px;
            font-weight: 600;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }

        /* الحقوق */
        .footer-credits {
            font-size: 11px;
            color: #6b21a8;
            font-weight: 700;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="joker-viewport">
        <div class="ambient-glow"></div>

        <div class="brand-header">
            <div class="joker-avatar-frame">
                <div class="joker-avatar-inner">🃏</div>
            </div>
            <div class="brand-title">JOKER</div>
            <div class="brand-subtitle">ULTIMATE ONLINE ARENA</div>
        </div>

        <div class="auth-card">
            
            <div class="auth-tabs">
                <button class="tab-button active" id="tabLogin" onclick="switchAuthMode('login')">تسجيل الدخول</button>
                <button class="tab-button" id="tabRegister" onclick="switchAuthMode('register')">حساب جديد</button>
            </div>

            <div class="field-group">
                <label>اسم المستخدم (Username):</label>
                <input type="text" id="usernameInput" placeholder="أدخل اسمك أو لقبك...">
            </div>

            <div class="field-group">
                <label>كلمة السر (Password):</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>

            <div class="field-group">
                <label>اختر السيرفر:</label>
                <select id="serverSelect">
                    <option value="ME-1">🟢 الشرق الأوسط (ME-Server 01)</option>
                    <option value="EU-1">🟡 أوروبا (EU-Server 01)</option>
                    <option value="VIP-ROOM">⭐ سيرفر الجوكر VIP</option>
                </select>
            </div>

            <button class="submit-action-btn" id="actionBtn" onclick="handleAuthSubmit()">
                <span>دخول السيرفر</span>
                <span>🚀</span>
            </button>

            <div class="server-indicator">
                <div class="pulse-dot"></div>
                <span>السيرفرات متصلة وجاهزة للعب</span>
            </div>

        </div>

        <div class="footer-credits">JOKER ENGINE v2.0 • 2026</div>
    </div>

    <script>
        let mode = 'login';

        function switchAuthMode(selectedMode) {
            mode = selectedMode;
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const actionBtn = document.getElementById('actionBtn');

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                actionBtn.innerHTML = '<span>دخول السيرفر</span> <span>🚀</span>';
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                actionBtn.innerHTML = '<span>إنشاء الحساب الان</span> <span>✨</span>';
            }
        }

        function handleAuthSubmit() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const server = document.getElementById('serverSelect').value;

            if (!user || !pass) {
                alert("⚠️ يرجى إدخال اسم المستخدم وكلمة السر لاستكمال الدخول!");
                return;
            }

            let usersDB = JSON.parse(localStorage.getItem('joker_users_db')) || {};

            if (mode === 'register') {
                if (usersDB[user]) {
                    alert("❌ اسم المستخدم هذا موجود بالفعل! اختر اسماً آخر.");
                    return;
                }
                usersDB[user] = { password: pass, coins: 5000, gems: 100 };
                localStorage.setItem('joker_users_db', JSON.stringify(usersDB));
                alert("🎉 تم إنشاء حسابك بنجاح! جاري تحويلك للعبة...");
            } else {
                if (!usersDB[user] || usersDB[user].password !== pass) {
                    alert("❌ اسم المستخدم أو كلمة السر غير صحيحة!");
                    return;
                }
            }

            localStorage.setItem('joker_current_user', user);
            localStorage.setItem('joker_server', server);

            // الانتقال للواجهة الرئيسية (main.html)
            window.location.href = "main.html";
        }
    </script>
</body>
</html>
