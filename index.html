<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <!-- استدعاء أيقونات FontAwesome للمظهر الاحترافي -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --wa-bg: #111b21;
            --wa-header-bg: #202c33;
            --wa-side-bg: #111b21;
            --wa-chat-bg: #0b141a;
            --wa-active-chat: #2a3942;
            --wa-hover-chat: #202c33;
            --wa-primary: #00a884;
            --wa-text-primary: #e9edef;
            --wa-text-secondary: #8696a0;
            --wa-outgoing-bubble: #005c4b;
            --wa-incoming-bubble: #202c33;
            --wa-border: #222d34;
            --wa-input-bg: #2a3942;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #090e11;
            color: var(--wa-text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Container الرئيسي للتطبيق */
        .app-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            background-color: var(--wa-bg);
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* ==================== الشريط الجانبي (Sidebar) ==================== */
        .sidebar {
            width: 30%;
            min-width: 320px;
            max-width: 450px;
            background-color: var(--wa-side-bg);
            border-left: 1px solid var(--wa-border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 60px;
            background-color: var(--wa-header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #6a7f8a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            gap: 20px;
            color: var(--wa-text-secondary);
            font-size: 18px;
        }

        .header-actions i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .header-actions i:hover {
            color: var(--wa-text-primary);
        }

        /* صندوق البحث والفلترة */
        .search-container {
            padding: 8px 12px;
            background-color: var(--wa-bg);
            border-bottom: 1px solid var(--wa-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-wrapper {
            background-color: var(--wa-header-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            flex: 1;
            height: 35px;
        }

        .search-wrapper i {
            color: var(--wa-text-secondary);
            font-size: 14px;
        }

        .search-wrapper input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--wa-text-primary);
            padding: 8px;
            width: 100%;
            font-size: 14px;
        }

        /* تصنيفات المحادثات */
        .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--wa-border);
        }

        .tab-btn {
            background-color: var(--wa-header-bg);
            color: var(--wa-text-secondary);
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #0a332c;
            color: var(--wa-primary);
            font-weight: bold;
        }

        /* قائمة المحادثات */
        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--wa-border);
            transition: background 0.2s;
        }

        .chat-item:hover {
            background-color: var(--wa-hover-chat);
        }

        .chat-item.active {
            background-color: var(--wa-active-chat);
        }

        .chat-avatar {
            width: 49px;
            height: 49px;
            border-radius: 50%;
            background-color: var(--wa-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            margin-left: 15px;
            flex-shrink: 0;
        }

        .chat-details {
            flex: 1;
            overflow: hidden;
        }

        .chat-title-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--wa-text-primary);
        }

        .chat-time {
            font-size: 12px;
            color: var(--wa-text-secondary);
        }

        .chat-last-msg {
            font-size: 14px;
            color: var(--wa-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==================== منطقة المحادثة (Main Chat) ==================== */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--wa-chat-bg);
            position: relative;
        }

        /* الخلفية المائلة النمطية للواتساب */
        .chat-window::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.04;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            pointer-events: none;
        }

        .chat-header {
            height: 60px;
            background-color: var(--wa-header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            border-bottom: 1px solid var(--wa-border);
        }

        .current-chat-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .messages-viewport {
            flex: 1;
            padding: 20px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1;
        }

        /* الفقاعات (Bubbles) */
        .msg-bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.2px;
            line-height: 19px;
            position: relative;
            word-wrap: break-word;
        }

        .msg-incoming {
            background-color: var(--wa-incoming-bubble);
            align-self: flex-start;
            border-top-right-radius: 0;
        }

        .msg-outgoing {
            background-color: var(--wa-outgoing-bubble);
            align-self: flex-end;
            border-top-left-radius: 0;
        }

        .msg-time {
            font-size: 11px;
            color: var(--wa-text-secondary);
            float: left;
            margin-top: 4px;
            margin-right: 8px;
        }

        .msg-outgoing .msg-time {
            color: #8fa0a8;
        }

        /* منطقة الكتابة والإرسال */
        .chat-footer {
            min-height: 62px;
            background-color: var(--wa-header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .chat-footer i {
            color: var(--wa-text-secondary);
            font-size: 22px;
            cursor: pointer;
        }

        .input-box-wrapper {
            flex: 1;
            background-color: var(--wa-input-bg);
            border-radius: 8px;
            padding: 10px 14px;
        }

        .input-box-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--wa-text-primary);
            font-size: 15px;
        }

        /* شاشة تسجل الدخول التراكبية Modal */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(11, 20, 26, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-card {
            background-color: var(--wa-header-bg);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--wa-border);
        }

        .login-card i.main-icon {
            font-size: 60px;
            color: var(--wa-primary);
            margin-bottom: 20px;
        }

        .login-card h2 {
            margin-bottom: 24px;
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            background-color: var(--wa-input-bg);
            border: 1px solid var(--wa-border);
            border-radius: 8px;
            color: var(--wa-text-primary);
            font-size: 15px;
            outline: none;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background-color: var(--wa-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-card button:hover {
            background-color: #008f70;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول بأسلوب واتساب -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <i class="fa-brands fa-whatsapp main-icon"></i>
            <h2>تسجيل الدخول إلى واتساب</h2>
            <input type="text" id="phoneInput" placeholder="رقم الهاتف (مثال: 01012345678)">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button onclick="handleLogin()">متابعة</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div class="app-wrapper">
        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-avatar" id="myAvatar">أ</div>
                <div class="header-actions">
                    <i class="fa-solid fa-users" title="المجتمعات"></i>
                    <i class="fa-solid fa-circle-notch" title="الحالة"></i>
                    <i class="fa-solid fa-message" title="محادثة جديدة"></i>
                    <i class="fa-solid fa-ellipsis-vertical" title="القائمة"></i>
                </div>
            </div>

            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="بحث أو بدء محادثة جديدة" onkeyup="searchChats()">
                </div>
            </div>

            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterCategory(this, 'all')">الكل</button>
                <button class="tab-btn" onclick="filterCategory(this, 'unread')">غير قراء</button>
                <button class="tab-btn" onclick="filterCategory(this, 'work')">العمل</button>
                <button class="tab-btn" onclick="filterCategory(this, 'family')">العائلة</button>
            </div>

            <div class="chats-list" id="chatsList">
                <!-- شات 1 -->
                <div class="chat-item active" onclick="selectChat(this, 'فريق التطوير', '01000000001')">
                    <div class="chat-avatar">ف</div>
                    <div class="chat-details">
                        <div class="chat-title-row">
                            <span class="chat-name">فريق التطوير</span>
                            <span class="chat-time">10:45 ص</span>
                        </div>
                        <div class="chat-last-msg">تم رفع ملفات المشروع على GitHub بنجاح 👍</div>
                    </div>
                </div>
                <!-- شات 2 -->
                <div class="chat-item" onclick="selectChat(this, 'أحمد محمود', '01122334455')">
                    <div class="chat-avatar" style="background-color: #6b34bc;">أ</div>
                    <div class="chat-details">
                        <div class="chat-title-row">
                            <span class="chat-name">أحمد محمود</span>
                            <span class="chat-time">أمس</span>
                        </div>
                        <div class="chat-last-msg">نتقابل الساعة 8 بالمكتب؟</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- منطقة الشات المفتوح -->
        <div class="chat-window">
            <div class="chat-header">
                <div class="current-chat-info">
                    <div class="user-avatar" id="activeAvatar">ف</div>
                    <div>
                        <div id="activeChatName" style="font-weight: 500;">فريق التطوير</div>
                        <div style="font-size: 12px; color: var(--wa-text-secondary);">متصل الآن</div>
                    </div>
                </div>
                <div class="header-actions">
                    <i class="fa-solid fa-video" title="مكالمة فيديو"></i>
                    <i class="fa-solid fa-phone" title="مكالمة صوتية"></i>
                    <i class="fa-solid fa-magnifying-glass" title="بحث"></i>
                    <i class="fa-solid fa-ellipsis-vertical" title="خيارات"></i>
                </div>
            </div>

            <!-- عرض الرسائل -->
            <div class="messages-viewport" id="messagesViewport">
                <div class="msg-bubble msg-incoming">
                    أهلاً بك في منصتك الجديدة المبتكرة!
                    <div class="msg-time">10:40 ص</div>
                </div>
                <div class="msg-bubble msg-outgoing">
                    مرحباً، الواجهة أصبحت مطابقة للواتساب تماماً وجاهزة للربط.
                    <div class="msg-time">10:45 ص</div>
                </div>
            </div>

            <!-- إدخال الرسائل -->
            <div class="chat-footer">
                <i class="fa-regular fa-face-smile" title="إيموجي"></i>
                <i class="fa-solid fa-paperclip" title="إرفاق ملف"></i>
                <div class="input-box-wrapper">
                    <input type="text" id="messageInput" placeholder="اكتب رسالة" onkeypress="handleKeyPress(event)">
                </div>
                <i class="fa-solid fa-paper-plane" id="sendBtn" onclick="sendMessage()" title="إرسال"></i>
            </div>
        </div>
    </div>

    <script>
        // تسجيل الدخول
        function handleLogin() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                alert('يرجى إدخال رقم الهاتف');
                return;
            }
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('myAvatar').innerText = phone.charAt(0).toUpperCase();
        }

        // اختيار محادثة
        function selectChat(element, name, phone) {
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            
            document.getElementById('activeChatName').innerText = name;
            document.getElementById('activeAvatar').innerText = name.charAt(0);
            
            // إعادة ضبط نافذة الرسائل للمحادثة المحددة
            const viewport = document.getElementById('messagesViewport');
            viewport.innerHTML = `
                <div class="msg-bubble msg-incoming">
                    بدء محادثة مشفرة مع ${name} (${phone})
                    <div class="msg-time">الآن</div>
                </div>
            `;
        }

        // إرسال رسالة جديدة
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const viewport = document.getElementById('messagesViewport');
            const now = new Date();
            const timeStr = now.getHours() + ':' + (now.getMinutes()<10?'0':'') + now.getMinutes();

            const msgHtml = `
                <div class="msg-bubble msg-outgoing">
                    ${text}
                    <div class="msg-time">${timeStr}</div>
                </div>
            `;
            
            viewport.insertAdjacentHTML('beforeend', msgHtml);
            input.value = '';
            viewport.scrollTop = viewport.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // بحث في المحادثات
        function searchChats() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.chat-item');
            items.forEach(item => {
                const name = item.querySelector('.chat-name').innerText.toLowerCase();
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        // فلترة الفئات
        function filterCategory(btn, category) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
