<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball - Splash Screen</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: #040209;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-screen {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 900px;
            /* خلفية إي فوتبول بنفس التدريج البنفسجي والأزرق والأسود */
            background: radial-gradient(circle at 50% 30%, #311158 0%, #15082a 50%, #05010d 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(112, 0, 255, 0.4);
        }

        /* تأثيرات الضوء في الخلفية */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, transparent 70%);
            top: 20%;
            pointer-events: none;
        }

        /* 1. الجزء العلوي: اللوجو ورقم النسخة */
        .header {
            text-align: center;
            margin-top: 30px;
            z-index: 2;
        }

        .efootball-logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: lowercase;
            font-style: italic;
        }

        .version-tag {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: 600;
        }

        /* 2. الجزء الأوسط: الكروت الدائرية (3D Rotating Wheel) */
        .wheel-container {
            width: 100%;
            height: 380px;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .wheel {
            width: 240px;
            height: 330px;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .item-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        /* توزيع العناصر على شكل حلقة دائرية */
        .item-card:nth-child(1) { 
            transform: rotateY(0deg) translateZ(200px); 
            background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(15, 3, 25, 0.95) 100%),
                        linear-gradient(135deg, #ec4899, #831843); 
        }
        .item-card:nth-child(2) { 
            transform: rotateY(90deg) translateZ(200px); 
            background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(3, 15, 25, 0.95) 100%),
                        linear-gradient(135deg, #3b82f6, #1e3a8a); 
        }
        .item-card:nth-child(3) { 
            transform: rotateY(180deg) translateZ(200px); 
            background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(3, 25, 15, 0.95) 100%),
                        linear-gradient(135deg, #10b981, #064e3b); 
        }
        .item-card:nth-child(4) { 
            transform: rotateY(270deg) translateZ(200px); 
            background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(25, 15, 3, 0.95) 100%),
                        linear-gradient(135deg, #f59e0b, #78350f); 
        }

        .card-badge {
            background: #facc15;
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 4px;
            width: max-content;
            margin-bottom: 6px;
        }

        .card-heading {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
        }

        /* 3. الجزء السفلي: زر الدخول والتعليمات */
        .footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 2;
            margin-bottom: 20px;
        }

        .press-start-btn {
            background: linear-gradient(90deg, #c084fc, #a855f7);
            color: white;
            border: none;
            width: 80%;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            cursor: pointer;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(168, 85, 247, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
        }

        .swipe-hint {
            font-size: 12px;
            color: #a855f7;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="game-screen">
        <div class="bg-glow"></div>

        <div class="header">
            <div class="efootball-logo">eFootball</div>
            <div class="version-tag">2026 SEASON</div>
        </div>

        <div class="wheel-container">
            <div class="wheel" id="wheel">
                
                <div class="item-card">
                    <div class="card-badge">مباشر</div>
                    <div class="card-heading">EVENTS</div>
                </div>

                <div class="item-card">
                    <div class="card-badge" style="background:#38bdf8;">الرئيسي</div>
                    <div class="card-heading">eFOOTBALL LEAGUE</div>
                </div>

                <div class="item-card">
                    <div class="card-badge" style="background:#4ade80;">التشكيلة</div>
                    <div class="card-heading">MY TEAM</div>
                </div>

                <div class="item-card">
                    <div class="card-badge" style="background:#f43f5e; color:#fff;">المتجر</div>
                    <div class="card-heading">SHOP</div>
                </div>

            </div>
        </div>

        <div class="footer">
            <div class="swipe-hint">◀ اسحب الشاشة للتلميح والتنقل ▶</div>
            <button class="press-start-btn" onclick="rotateWheel()">اضغط للبدء</button>
        </div>
    </div>

    <script>
        let currentRotation = 0;
        const wheel = document.getElementById('wheel');

        // تدوير الحلقة الدائرية
        function rotateWheel() {
            currentRotation -= 90;
            wheel.style.transform = `rotateY(${currentRotation}deg)`;
        }

        // دعم السحب باليد (Touch Drag)
        let startX = 0;
        document.querySelector('.wheel-container').addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
        });

        document.querySelector('.wheel-container').addEventListener('touchend', e => {
            let endX = e.changedTouches[0].clientX;
            if (startX - endX > 40) {
                currentRotation -= 90; // دوران لليسار
            } else if (endX - startX > 40) {
                currentRotation += 90; // دوران لليمن
            }
            wheel.style.transform = `rotateY(${currentRotation}deg)`;
        });
    </script>
</body>
</html>
