<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Ultimate Store</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-viewport {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 35px;
        }

        /* شريط القمة */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 10px 20px;
            border-radius: 15px;
        }

        .store-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .coins-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid var(--gold);
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--gold);
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* حاوية الباكيدجات */
        .packs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 15px 0;
        }

        .pack-card {
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.9) 0%, rgba(20, 40, 65, 0.95) 100%);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            height: 310px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            transition: 0.3s ease;
        }

        .pack-card:hover {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transform: translateY(-5px);
        }

        .pack-icon {
            font-size: 50px;
            filter: drop-shadow(0 0 15px var(--gold));
        }

        .pack-name {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-main);
        }

        .pack-price {
            font-size: 16px;
            color: var(--gold);
            font-weight: bold;
        }

        .buy-btn {
            background: linear-gradient(45deg, var(--gold), #ffaa00);
            border: none;
            color: #020408;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px var(--gold-glow);
            width: 100%;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* نافذة نتيجة فتح الباكيدج (مخفية بالافتراضي) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 8, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            display: none;
        }

        .pulled-player-card {
            background: linear-gradient(135deg, #102a45, #0a192f);
            border: 3px solid var(--accent);
            border-radius: 20px;
            padding: 25px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 40px var(--accent-glow);
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pulled-name {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent);
            margin: 10px 0;
        }

        .pulled-rating {
            font-size: 20px;
            color: var(--gold);
            font-weight: bold;
        }

        .close-modal-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 8px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .close-modal-btn:hover {
            background: var(--accent);
            color: #020408;
        }

        /* شريط التذييل */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            padding: 8px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .back-btn:hover {
            background: var(--cyan);
            color: #020408;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div class="store-title">🎁 متجر الباكيدجات الأسطوري</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="packs-container">
            <div class="pack-card">
                <div class="pack-icon">📦</div>
                <div>
                    <div class="pack-name">الباكيدج البرونزي</div>
                    <div class="pack-price">🪙 200 عملة</div>
                </div>
                <button class="buy-btn" onclick="openPack(200, 'bronze')">فتح الباكيدج</button>
            </div>

            <div class="pack-card">
                <div class="pack-icon" style="filter: drop-shadow(0 0 15px var(--cyan));">🥈</div>
                <div>
                    <div class="pack-name">الباكيدج الفضي</div>
                    <div class="pack-price">🪙 500 عملة</div>
                </div>
                <button class="buy-btn" onclick="openPack(500, 'silver')">فتح الباكيدج</button>
            </div>

            <div class="pack-card">
                <div class="pack-icon" style="filter: drop-shadow(0 0 15px var(--gold));">🌟</div>
                <div>
                    <div class="pack-name">باكيدج الأساطير</div>
                    <div class="pack-price">🪙 1000 عملة</div>
                </div>
                <button class="buy-btn" onclick="openPack(1000, 'gold')">فتح الباكيدج</button>
            </div>
        </div>

        <div id="rewardModal" class="modal-overlay">
            <div style="font-size: 22px; color: var(--gold); font-weight: bold;">🎉 مبروك! لقد حصلت على لاعب جديد:</div>
            <div class="pulled-player-card">
                <div style="font-size: 45px;">⚽</div>
                <div id="pulledPlayerName" class="pulled-name">اسم اللاعب</div>
                <div id="pulledPlayerRating" class="pulled-rating">الطاقة: 88</div>
            </div>
            <button class="close-modal-btn" onclick="closeModal()">إضافة للنادي واستمرار</button>
        </div>

        <div class="bottom-bar">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <div style="font-size: 13px; color: rgba(255,255,255,0.5);">Joker Store System</div>
        </div>
    </div>

    <script>
        // قراءة العملات
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        // قوائم اللاعبين العشوائية حسب نوع الباكيدج
        const bronzePlayers = [
            { name: "أحمد سمير", rating: 74, pos: "DEF" },
            { name: "محمود حسن", rating: 72, pos: "MID" },
            { name: "كريم البدري", rating: 75, pos: "ATT" }
        ];

        const silverPlayers = [
            { name: "كيفين دي بروين (نسخة عادية)", rating: 85, pos: "MID" },
            { name: "محمد صلاح (نسخة أساسية)", rating: 88, pos: "ATT" },
            { name: "فيرجيل فان دايك", rating: 86, pos: "DEF" }
        ];

        const goldPlayers = [
            { name: "ليونيل ميسي (أسطورة الأرجنتين)", rating: 94, pos: "ATT" },
            { name: "كريستيانو رونالدو (الدون الأسطوري)", rating: 93, pos: "ATT" },
            { name: "كيليان مبابي (السرعة الخارقة)", rating: 92, pos: "ATT" },
            { name: "إيرلينغ هالاند (الماكينة)", rating: 91, pos: "ATT" }
        ];

        function openPack(price, type) {
            if (coins < price) {
                alert("عذراً، رصيدك غير كافٍ! العب مباريات أو اختر باكيدج أرخص.");
                return;
            }

            // خصم الثمن وتحديث العملات
            coins -= price;
            localStorage.setItem('userCoins', coins);
            document.getElementById('playerCoins').innerText = coins;

            // اختيار لاعب عشوائي
            let pool = bronzePlayers;
            if (type === 'silver') pool = silverPlayers;
            if (type === 'gold') pool = goldPlayers;

            let randomPlayer = pool[Math.floor(Math.random() * pool.length)];

            // عرض البيانات في النافذة المنبثقة
            document.getElementById('pulledPlayerName').innerText = randomPlayer.name;
            document.getElementById('pulledPlayerRating').innerText = "المركز: " + randomPlayer.pos + " | الطاقة: " + randomPlayer.rating;
            document.getElementById('rewardModal').style.display = 'flex';

            // حفظ اللاعب في قائمة لاعبي النادي (LocalStorage)
            let myPlayers = JSON.parse(localStorage.getItem('myTeamPlayers')) || [];
            myPlayers.push(randomPlayer);
            localStorage.setItem('myTeamPlayers', JSON.stringify(myPlayers));
        }

        function closeModal() {
            document.getElementById('rewardModal').style.display = 'none';
        }
    </script>

</body>
</html>
