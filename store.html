<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Mega Ultimate Store (1000+ Players)</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px 30px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 8px 20px; border-radius: 15px;
        }

        .match-title { font-size: 15px; font-weight: 900; color: var(--gold); }

        .coins-container {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold);
            padding: 4px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 15px;
        }

        .store-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 410px;
        }

        /* تصميم الكارت الأسطوري الفخم */
        .mega-card {
            width: 260px; height: 350px;
            background: linear-gradient(135deg, #111 0%, #1a2a3a 100%);
            border: 3px solid var(--gold);
            border-radius: 22px;
            box-shadow: 0 0 35px var(--gold-glow);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 15px; text-align: center; position: relative;
            animation: cardPopup 0.4s ease-out;
        }

        @keyframes cardPopup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-header { display: flex; justify-content: space-between; width: 100%; font-weight: bold; color: var(--gold); font-size: 14px; }
        .card-name { font-size: 18px; font-weight: 900; color: var(--text-main); margin: 2px 0; text-shadow: 0 0 10px var(--accent-glow); }
        .card-pos { font-size: 12px; color: var(--accent); background: rgba(0,255,136,0.15); padding: 2px 10px; border-radius: 8px; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%;
            background: rgba(0,0,0,0.4); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            font-size: 11px; color: #ccc;
        }
        .stat-item { display: flex; justify-content: space-between; padding: 0 4px; }
        .stat-val { color: var(--gold); font-weight: bold; }

        .pack-btn {
            background: linear-gradient(45deg, var(--gold), var(--accent));
            border: none; color: #020408; padding: 12px 25px; border-radius: 25px;
            font-weight: 900; font-size: 15px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .pack-btn:hover { transform: scale(1.05); }

        .back-btn {
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
            padding: 5px 15px; border-radius: 30px; cursor: pointer; font-size: 12px; font-weight: bold; text-decoration: none;
        }

        .msg-box { font-size: 12px; color: var(--accent); font-weight: bold; text-align: center; min-height: 20px; }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div class="match-title">🎁 متجر الباكجات الأسطورية (1000+ لاعب عالمي ومصري)</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="store-content">
            <div id="cardDisplayArea">
                <div style="font-size: 14px; color: #aaa; text-align:center; padding: 80px 0;">
                    اضغط على زر فتح الباكج لاكتشاف أسطورة جديدة من بين أكثر من 1000 لاعب (طاقات من 97 لـ 105)!
                </div>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <button class="pack-btn" onclick="openMegaPack()">افتح باكج أسطوري (تكلفة: 200 🪙)</button>
                <div id="storeMsg" class="msg-box"></div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <a href="squad.html" class="back-btn" style="border-color:var(--gold); color:var(--gold);">إدارة التشكيلة وبيع اللاعبين ➔</a>
        </div>
    </div>

    <script>
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        // توليد قاعدة بيانات ضخمة تحتوي على أكثر من 1000 لاعب (مصرية، عربية، وأساطير عالمية)
        function generateMassiveDatabase() {
            let db = [];
            let firstNames = ["محمد", "أحمد", "محمود", "كريم", "إسلام", "عمر", "يوسف", "ليونيل", "كريستيانو", "كيليان", "إيرلينج", "كيفين", "فينيسيوس", "جود", "فيرجيل", "روبن", "محمد", "تريزيجيه", "إمام", "مصطفى", "عثمان", "نيمار", "ساديو", "محمد", "رمضان"];
            let lastNames = ["صلاح", "الشحات", "هلال", "بركات", "زيدان", "ميسي", "رونالدو", "مبابي", "هالاند", "دي بروين", "جونيور", "بيلينغهام", "فان دايك", "دياز", "الشناع", "حسن", "عاشور", "محمد", "ديمبيلي", "ماني", "صلاح", "المرعب", "الملك", "الأسطورة", "الصاروخ"];
            let positions = ["ATT", "MID", "DEF", "GK", "LW", "RW", "CM"];
            
            let idCounter = 1;
            // توليد أكثر من 1000 لاعب فريد برمجياً
            for (let f of firstNames) {
                for (let l of lastNames) {
                    for (let i = 1; i <= 15; i++) {
                        let rating = Math.floor(Math.random() * (105 - 97 + 1)) + 97; // طاقات من 97 إلى 105
                        let pos = positions[Math.floor(Math.random() * positions.length)];
                        db.push({
                            id: idCounter++,
                            name: `${f} ${l} ${i > 1 ? '#' + i : ''}`,
                            pos: pos,
                            rating: rating,
                            price: rating * 80, // سعر بيع واسترداد حسب التقييم
                            pace: Math.floor(Math.random() * (99 - 90 + 1)) + 90,
                            shooting: Math.floor(Math.random() * (99 - 90 + 1)) + 90,
                            passing: Math.floor(Math.random() * (99 - 90 + 1)) + 90,
                            defending: Math.floor(Math.random() * (95 - 80 + 1)) + 80
                        });
                    }
                }
            }
            return db;
        }

        // جلب أو إنشاء قاعدة البيانات
        let masterDatabase = JSON.parse(localStorage.getItem('masterPlayerDB'));
        if (!masterDatabase || masterDatabase.length < 1000) {
            masterDatabase = generateMassiveDatabase();
            localStorage.setItem('masterPlayerDB', JSON.stringify(masterDatabase));
        }

        // قائمة اللاعبين الذين تم سحبهم مسبقاً (لمنع التكرار نهائياً)
        let collectedIDs = JSON.parse(localStorage.getItem('collectedPlayerIDs')) || [];

        function openMegaPack() {
            let packCost = 200;
            if (coins < packCost) {
                document.getElementById('storeMsg').innerText = "❌ رصيدك لا يكفي لفتح هذا الباكج!";
                document.getElementById('storeMsg').style.color = "var(--pink)";
                return;
            }

            // تصفية اللاعبين المتاحين (غير المكررين الذين لم يظهروا من قبل)
            let availablePlayers = masterDatabase.filter(p => !collectedIDs.includes(p.id));

            if (availablePlayers.length === 0) {
                document.getElementById('storeMsg').innerText = "🏆 لقد قمت بجمع كل لاعبي اللعبة الأساطير بنجاح تام!";
                return;
            }

            coins -= packCost;
            document.getElementById('playerCoins').innerText = coins;
            localStorage.setItem('userCoins', coins);

            // اختيار لاعب عشوائي من غير المكررين
            let randomIndex = Math.floor(Math.random() * availablePlayers.length);
            let wonPlayer = availablePlayers[randomIndex];

            // تسجيله في قائمة المستلمين حتى لا يتكرر أبداً
            collectedIDs.push(wonPlayer.id);
            localStorage.setItem('collectedPlayerIDs', JSON.stringify(collectedIDs));

            // حفظه في قائمة لاعبي النادي المشتراة لكي يظهر في التشكيلة والبيع
            let purchased = JSON.parse(localStorage.getItem('purchasedPlayers')) || [];
            purchased.push(wonPlayer);
            localStorage.setItem('purchasedPlayers', JSON.stringify(purchased));

            // عرض الكارت الأسطوري المفصل
            let displayArea = document.getElementById('cardDisplayArea');
            displayArea.innerHTML = `
                <div class="mega-card">
                    <div class="card-header">
                        <span>⭐ ${wonPlayer.rating}</span>
                        <span>${wonPlayer.pos}</span>
                    </div>
                    <div>
                        <div class="card-name">${wonPlayer.name}</div>
                        <div class="card-pos">طاقات أسطورية خارقة</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item"><span>السرعة:</span> <span class="stat-val">${wonPlayer.pace}</span></div>
                        <div class="stat-item"><span>التسديد:</span> <span class="stat-val">${wonPlayer.shooting}</span></div>
                        <div class="stat-item"><span>التمرير:</span> <span class="stat-val">${wonPlayer.passing}</span></div>
                        <div class="stat-item"><span>الدفاع:</span> <span class="stat-val">${wonPlayer.defending}</span></div>
                    </div>
                    <div style="font-size: 11px; color: var(--gold);">🪙 قيمة البيع: ${wonPlayer.price}</div>
                </div>
            `;

            document.getElementById('storeMsg').innerText = `🎉 مبروك! حصلت على الأسطورة ${wonPlayer.name} ولن يتكرر في الباكجات مرة أخرى!`;
            document.getElementById('storeMsg').style.color = "var(--accent)";
        }
    </script>

</body>
</html>
