<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Pro Massive Packs Store</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --text-main: #ffffff;
        }
        
        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 25px 35px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 10px 20px; border-radius: 15px;
        }

        .store-title { font-size: 20px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }

        .coins-container {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold);
            padding: 5px 15px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 18px;
        }

        .packs-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 15px 0;
        }

        .pack-card {
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.9) 0%, rgba(20, 40, 65, 0.95) 100%);
            border: 2px solid rgba(255, 215, 0, 0.4); border-radius: 20px; height: 310px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 20px; text-align: center; transition: 0.3s ease;
        }
        .pack-card:hover { border-color: var(--gold); transform: translateY(-5px); }

        .pack-icon { font-size: 50px; filter: drop-shadow(0 0 15px var(--gold)); }
        .pack-name { font-size: 20px; font-weight: 900; color: var(--text-main); }
        .pack-price { font-size: 16px; color: var(--gold); font-weight: bold; }

        .buy-btn {
            background: linear-gradient(45deg, var(--gold), #ffaa00); border: none;
            color: #020408; padding: 10px 20px; border-radius: 25px; font-weight: bold;
            font-size: 15px; cursor: pointer; width: 100%; box-shadow: 0 0 10px var(--gold-glow);
        }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.94); display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 15px; z-index: 10; display: none;
        }

        .fut-card {
            width: 240px; height: 340px;
            background: linear-gradient(135deg, #2c2200 0%, #b8860b 40%, #ffd700 70%, #fff8dc 100%);
            border-radius: 18px; padding: 18px; text-align: center; color: #111;
            box-shadow: 0 0 50px var(--gold-glow); position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            border: 3px solid #fff;
        }

        .fut-rating { font-size: 40px; font-weight: 900; color: #1a1a1a; }
        .fut-pos { font-size: 15px; font-weight: bold; color: #333; }
        .fut-name { font-size: 19px; font-weight: 900; background: #111; color: #ffd700; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #d4af37; }

        .close-modal-btn {
            background: transparent; border: 2px solid var(--accent); color: var(--accent);
            padding: 8px 30px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        .close-modal-btn:hover { background: var(--accent); color: #020408; }

        .back-btn {
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
            padding: 8px 25px; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: bold; text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div class="store-title">🎁 متجر الباكيدجات بطلاقات خرافية</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="packs-container">
            <div class="pack-card">
                <div class="pack-icon">📦</div>
                <div>
                    <div class="pack-name">باكيدج المدافعين والحراس</div>
                    <div class="pack-price">🪙 250 عملة</div>
                </div>
                <button class="buy-btn" onclick="openPack(250, 'defenders')">فتح الباكيدج</button>
            </div>

            <div class="pack-card">
                <div class="pack-icon" style="filter: drop-shadow(0 0 15px var(--cyan));">🛡️</div>
                <div>
                    <div class="pack-name">باكيدج النجوم المميزين</div>
                    <div class="pack-price">🪙 600 عملة</div>
                </div>
                <button class="buy-btn" onclick="openPack(600, 'silver')">فتح الباكيدج</button>
            </div>

            <div class="pack-card">
                <div class="pack-icon" style="filter: drop-shadow(0 0 15px var(--gold));">🌟</div>
                <div>
                    <div class="pack-name">باكيدج الأساطير الخارقة</div>
                    <div class="pack-price">🪙 1200 عملة</div>
                </div>
                <button class="buy-btn" onclick="openPack(1200, 'gold')">فتح الباكيدج</button>
            </div>
        </div>

        <div id="rewardModal" class="modal-overlay">
            <div style="font-size: 21px; color: var(--gold); font-weight: bold;">✨ مبروك! حصلت على لاعب بطاقة عالية:</div>
            
            <div class="fut-card">
                <div style="width:100%; display:flex; flex-direction:column; align-items:flex-start;">
                    <div id="cardRating" class="fut-rating">96</div>
                    <div id="cardPos" class="fut-pos">CB</div>
                </div>
                <div style="font-size: 60px;">🛡️</div>
                <div id="cardName" class="fut-name">فيرجيل فان دايك</div>
            </div>

            <button class="close-modal-btn" onclick="closeModal()">إضافة للنادي واستمرار 🚀</button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <div style="font-size: 13px; color: rgba(255,255,255,0.5);">Joker Pro Stacking 2026</div>
        </div>
    </div>

    <script>
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        // قوائم ضخمة جداً ومكدسة بالحراس والمدافعين بطاقات عالية جداً
        const defenderPlayers = [
            { name: "فيرجيل فان دايك (أسطوري)", rating: 95, pos: "CB" },
            { name: "مانويل نوير (حارس عملاق)", rating: 94, pos: "GK" },
            { name: "تيبو كورتوا (حارس خارق)", rating: 96, pos: "GK" },
            { name: "روبن دياز (صخرة الدفاع)", rating: 93, pos: "CB" },
            { name: "سيرجيو راموس (الأسطورة)", rating: 94, pos: "CB" },
            { name: "أليسون بيكر (جدار بريد)", rating: 93, pos: "GK" },
            { name: "كارليس بويول (قلب الأسد)", rating: 95, pos: "CB" },
            { name: "باولو مالديني (أعظم مدافع)", rating: 98, pos: "CB" },
            { name: "جيانلويجي بوفون (ملك الحراس)", rating: 97, pos: "GK" },
            { name: "ماركينيوس", rating: 91, pos: "CB" },
            { name: "أنطونيو روديجر", rating: 92, pos: "CB" },
            { name: "إيدرسون مواريس", rating: 92, pos: "GK" },
            { name: "كايل ووكر", rating: 91, pos: "RB" }
        ];

        const silverPlayers = [
            { name: "كيفين دي بروين (الماجيك)", rating: 96, pos: "CM" },
            { name: "محمد صلاح (الملك المصري)", rating: 97, pos: "RW" },
            { name: "نيمار جونيور", rating: 95, pos: "LW" },
            { name: "لوكا مودريتش", rating: 94, pos: "CM" },
            { name: "توني كروس", rating: 94, pos: "CM" },
            { name: "برونو فرنانديز", rating: 93, pos: "CAM" },
            { name: "بوكايو ساكا", rating: 92, pos: "RW" },
            { name: "فيل فودين", rating: 92, pos: "LW" }
        ];

        const goldPlayers = [
            { name: "ليونيل ميسي (GOAT)", rating: 99, pos: "RW" },
            { name: "كريستيانو رونالدو (CR7)", rating: 99, pos: "ST" },
            { name: "كيليان مبابي (الصاروخ)", rating: 98, pos: "ST" },
            { name: "إيرلينغ هالاند (الماكينة)", rating: 97, pos: "ST" },
            { name: "جود بيلينغهام (الجوهرة)", rating: 96, pos: "CM" },
            { name: "فينيسيوس جونيور", rating: 96, pos: "LW" },
            { name: "رودري (أفضل متوسط ميدان)", rating: 96, pos: "CDM" }
        ];

        function openPack(price, type) {
            if (coins < price) {
                alert("عذراً، رصيدك غير كافٍ! العب مباريات الدوري لجمع العملات.");
                return;
            }

            coins -= price;
            localStorage.setItem('userCoins', coins);
            document.getElementById('playerCoins').innerText = coins;

            let pool = defenderPlayers;
            if (type === 'silver') pool = silverPlayers;
            if (type === 'gold') pool = goldPlayers;

            let randomPlayer = pool[Math.floor(Math.random() * pool.length)];

            document.getElementById('cardRating').innerText = randomPlayer.rating;
            document.getElementById('cardPos').innerText = randomPlayer.pos;
            document.getElementById('cardName').innerText = randomPlayer.name;
            document.getElementById('rewardModal').style.display = 'flex';

            let myPlayers = JSON.parse(localStorage.getItem('myTeamPlayers')) || [];
            myPlayers.push(randomPlayer);
            localStorage.setItem('myTeamPlayers', JSON.stringify(myPlayers));
        }

        function closeModal() {
            document.getElementById('rewardModal').style.display = 'none';
        }
    </script>

</body>
</html>
