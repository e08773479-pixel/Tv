<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOKER GAMES - الرئيسية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #fbf8f3;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-viewport {
            width: 100vw;
            height: 100vh;
            background: #fbf8f3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px 15px 12px 15px;
            position: relative;
            overflow: hidden;
        }

        /* --- الديكورات الجانبية والخلفية (طابق الصورة) --- */
        .bg-circle-top-left {
            position: absolute;
            top: -40px;
            left: -40px;
            width: 150px;
            height: 150px;
            background: #e0f2fe;
            border-radius: 50%;
            z-index: 1;
        }

        .bg-circle-top-right {
            position: absolute;
            top: -50px;
            right: -30px;
            width: 170px;
            height: 170px;
            background: #fef08a;
            border-radius: 50%;
            z-index: 1;
        }

        .bg-circle-bottom-right {
            position: absolute;
            bottom: 70px;
            right: -40px;
            width: 140px;
            height: 140px;
            background: #fca5a5;
            border-radius: 50%;
            z-index: 1;
            opacity: 0.85;
        }

        /* رسومات الصاعقة البرقية البارزة */
        .lightning-left, .lightning-right {
            position: absolute;
            top: 20%;
            font-size: 85px;
            z-index: 2;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
        }

        .lightning-left { left: 8px; transform: rotate(12deg); }
        .lightning-right { right: 8px; transform: rotate(-12deg); }

        /* --- 1. الشريط العلوي --- */
        .top-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .notification-btn {
            width: 44px;
            height: 44px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            font-size: 20px;
        }

        .user-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 5px 14px 5px 8px;
            border-radius: 30px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .user-details {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .user-name {
            font-weight: 800;
            font-size: 14px;
            color: #0f172a;
        }

        .user-score {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            background: #065f46;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 18px;
            border: 2px solid #facc15;
        }

        /* --- 2. الشعار المركزي (قفازات + اسم اللعبة) --- */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            margin-top: -15px;
        }

        /* القفازات المتصادمة بنفس الصورة */
        .clash-boxing-gloves {
            font-size: 68px;
            line-height: 1;
            margin-bottom: 5px;
            animation: clashPulse 2.5s infinite ease-in-out;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
        }

        @keyframes clashPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .joker-logo-title {
            text-align: center;
        }

        /* خط الجوكر ثلاثي الأبعاد الكرتوني */
        .joker-main-text {
            font-size: 46px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 
                3px 3px 0 #1e3a8a,
                -3px -3px 0 #1e3a8a,
                3px -3px 0 #1e3a8a,
                -3px 3px 0 #1e3a8a,
                0 6px 0 #1e3a8a,
                0 10px 20px rgba(0,0,0,0.25);
            letter-spacing: 1px;
            line-height: 0.85;
        }

        .joker-sub-text {
            font-size: 34px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 
                2.5px 2.5px 0 #1e3a8a,
                -2.5px -2.5px 0 #1e3a8a,
                2.5px -2.5px 0 #1e3a8a,
                -2.5px 2.5px 0 #1e3a8a,
                0 5px 0 #1e3a8a;
            letter-spacing: 1px;
        }

        /* --- 3. أزرار التحكم الثلاثة (كل زر ينقلك لملف) --- */
        .actions-container {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
            margin-bottom: 5px;
        }

        .menu-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 18px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 10px 15px rgba(0,0,0,0.12);
            transition: all 0.15s ease;
        }

        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        /* الزر الأحمر: الألعاب -> يفتح ملف games.html */
        .btn-games {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
            border-bottom: 4px solid #991b1b;
        }

        /* الزر الأزرق: الانضمام لغرفة -> يفتح ملف join.html */
        .btn-join {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
            border-bottom: 4px solid #1e40af;
        }

        /* الزر البنفسجي: كيفية اللعب -> يفتح ملف howto.html */
        .btn-how {
            background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
            border-bottom: 4px solid #581c87;
        }

        .btn-icon-left { font-size: 22px; }
        .btn-arrow-right { font-size: 18px; font-weight: bold; }

        /* --- 4. الشريط السفلي الكبسولي --- */
        .bottom-nav-bar {
            width: 100%;
            max-width: 390px;
            height: 60px;
            background: #1d4ed8;
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 10;
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.35);
        }

        .nav-icon-item {
            color: #93c5fd;
            font-size: 20px;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-icon-item.active {
            background: #38bdf8;
            color: white;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <div class="bg-circle-top-left"></div>
        <div class="bg-circle-top-right"></div>
        <div class="bg-circle-bottom-right"></div>

        <div class="lightning-left">⚡</div>
        <div class="lightning-right">⚡</div>

        <div class="top-header">
            <div class="notification-btn" onclick="openPage('notifications.html')">
                🔔
            </div>

            <div class="user-widget" onclick="openPage('profile.html')">
                <div class="user-details">
                    <span class="user-name" id="userNameDisplay">--</span>
                    <span class="user-score">🏆 0</span>
                </div>
                <div class="user-avatar" id="userAvatarDisplay">J</div>
            </div>
        </div>

        <div class="logo-section">
            <div class="clash-boxing-gloves">🥊💥🥊</div>
            <div class="joker-logo-title">
                <div class="joker-main-text">JOKER</div>
                <div class="joker-sub-text">GAMES</div>
            </div>
        </div>

        <div class="actions-container">
            <button class="menu-btn btn-games" onclick="openPage('games.html')">
                <span class="btn-icon-left">🎮</span>
                <span>الألعاب</span>
                <span class="btn-arrow-right">❮</span>
            </button>

            <button class="menu-btn btn-join" onclick="openPage('join.html')">
                <span class="btn-icon-left">📲</span>
                <span>الانضمام لغرفة</span>
                <span class="btn-arrow-right">❮</span>
            </button>

            <button class="menu-btn btn-how" onclick="openPage('howto.html')">
                <span class="btn-icon-left">👥</span>
                <span>كيفية اللعب</span>
                <span class="btn-arrow-right">❮</span>
            </button>
        </div>

        <div class="bottom-nav-bar">
            <div class="nav-icon-item" onclick="openPage('profile.html')">👤</div>
            <div class="nav-icon-item" onclick="openPage('leaderboard.html')">📊</div>
            <div class="nav-icon-item" onclick="openPage('settings.html')">⚙️</div>
            <div class="nav-icon-item active" onclick="openPage('main.html')">🏠</div>
            <div class="nav-icon-item" onclick="openPage('sports.html')">⚽</div>
        </div>
    </div>

    <script>
        // دالة التنقل الفوري بين الملفات
        function openPage(pageName) {
            window.location.href = pageName;
        }

        // تحضير اسم اللاعب عند الفتح
        window.onload = function() {
            const currentUser = localStorage.getItem('joker_current_user') || "الجوكر";
            document.getElementById('userNameDisplay').innerText = currentUser;
            
            if (currentUser.length > 0) {
                document.getElementById('userAvatarDisplay').innerText = currentUser.charAt(0).toUpperCase();
            }
        };
    </script>
</body>
</html>
