<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Ultimate Live Match Engine</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }
        
        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px 25px;
        }

        /* شريط النتيجة الحي */
        .live-scoreboard {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.7); border: 2px solid var(--accent);
            padding: 8px 20px; border-radius: 18px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .team-display { font-size: 16px; font-weight: 900; color: var(--cyan); }
        .score-display { font-size: 26px; font-weight: 900; color: var(--gold); }
        
        .timer-box {
            background: var(--pink); color: #fff; padding: 4px 12px; border-radius: 15px;
            font-size: 16px; font-weight: bold; box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
        }

        /* ملعب المباراة المتحرك (الكرة واللاعبين) */
        .live-pitch {
            background: linear-gradient(180deg, rgba(0, 90, 35, 0.9), rgba(0, 45, 15, 0.95));
            border: 2px solid var(--gold); border-radius: 18px;
            height: 310px; position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 12px; box-shadow: inset 0 0 40px rgba(0, 255, 136, 0.3);
        }

        .pitch-center-circle {
            position: absolute; width: 90px; height: 90px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .commentary-box {
            background: rgba(0, 0, 0, 0.85); border: 1px solid var(--cyan);
            padding: 8px 15px; border-radius: 12px; color: var(--text-main);
            font-size: 14px; font-weight: bold; text-align: center; width: 85%;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); z-index: 5;
        }

        /* ساحة حركة اللاعبين والكرة الحية */
        .match-action-area {
            position: relative; width: 100%; height: 140px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
        }

        .side-squad {
            background: rgba(0, 0, 0, 0.7); border: 1px solid var(--gold); padding: 8px 12px;
            border-radius: 12px; color: #fff; text-align: center; font-size: 11px; font-weight: bold;
            box-shadow: 0 0 10px rgba(255,215,0,0.3); width: 140px;
        }

        /* الكورة المتحركة بين الخطوط */
        .moving-ball {
            font-size: 26px; position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%); transition: 0.8s ease-in-out;
            filter: drop-shadow(0 0 12px #fff);
        }

        /* لوحة التحكم والتبديلات التكتيكية */
        .tactics-control-panel {
            display: flex; gap: 10px; width: 100%; justify-content: center; align-items: center; z-index: 5;
        }

        .tactic-btn {
            background: rgba(0, 240, 255, 0.15); border: 1px solid var(--cyan);
            color: var(--cyan); padding: 6px 14px; border-radius: 15px; font-weight: bold;
            font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .tactic-btn:hover { background: var(--cyan); color: #020408; }

        .skip-btn {
            background: linear-gradient(45deg, var(--gold), #ffaa00); border: none;
            color: #020408; padding: 6px 16px; border-radius: 15px; font-weight: 900;
            font-size: 12px; cursor: pointer; box-shadow: 0 0 10px var(--gold-glow);
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="live-scoreboard">
            <div id="homeTeamName" class="team-display">ناديك</div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="homeScore" class="score-display">0</span>
                <span style="color:var(--pink); font-size:18px;">-</span>
                <span id="awayScore" class="score-display">0</span>
            </div>
            <div id="awayTeamName" class="team-display" style="color: var(--pink);">الخصم</div>
            <div id="matchTimer" class="timer-box">00'</div>
        </div>

        <div class="live-pitch">
            <div class="pitch-center-circle"></div>
            
            <div id="matchCommentary" class="commentary-box">صافرة البداية! الـ 11 لاعباً في الملعب يبدأون المعركة...</div>

            <div class="match-action-area">
                <div class="side-squad" id="homeSquadInfo">
                    <div style="color: var(--accent);">فريقك (11 لاعب) ⚽</div>
                    <div style="font-size: 9px; color: #aaa;">جاهزون للهجوم</div>
                </div>

                <div id="matchBall" class="moving-ball">⚽</div>

                <div class="side-squad" style="border-color: var(--pink);" id="awaySquadInfo">
                    <div style="color: var(--pink);">الخصم (11 لاعب) 🛡️</div>
                    <div style="font-size: 9px; color: #aaa;">تنظيم دفاعي قوي</div>
                </div>
            </div>

            <div class="tactics-control-panel">
                <button class="tactic-btn" onclick="applyTactics('attack')">⚡ تبديل هجومي (دفع الهدافين)</button>
                <button class="tactic-btn" onclick="applyTactics('defense')">🛡️ تحصين الدفاع (تأمين المرمى)</button>
                <button class="skip-btn" onclick="finishMatchInstantly()">إنهاء الماتش فوراً ⏩</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 11px; color: rgba(255,255,255,0.5);">Joker Live Engine 2026</div>
            <div style="font-size: 11px; color: var(--accent);">تحكم مباشر وتحديث فوري للنتائج</div>
        </div>
    </div>

    <script>
        const userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        const opponentTeam = localStorage.getItem('currentOpponent') || 'الخصم القوي';
        
        document.getElementById('homeTeamName').innerText = userTeam;
        document.getElementById('awayTeamName').innerText = opponentTeam;

        let homeGoals = 0;
        let awayGoals = 0;
        let currentMinute = 0;
        let tacticBonus = 0;

        let myPlayers = JSON.parse(localStorage.getItem('myTeamPlayers')) || [];
        let squadPower = myPlayers.reduce((sum, p) => sum + (p.rating || 75), 0) / (myPlayers.length || 1);
        if (myPlayers.length === 0) squadPower = 75;

        let commentaryList = [
            "تمريرات قصيرة رائعة بين الـ 11 لاعباً في منتصف الميدان...",
            "ضغط هجومي مكثف وتوغلات خطيرة نحو منطقة الجزاء!",
            "الكرة تنقلب وتتحول لهجمة مرتدة سريعة للخصم...",
            "تسديدة قوية لكنها تمرين سهل لحارس المرمى.",
            "صراع بدني وتكتيكي قوي بين لاعبي الفريقين."
        ];

        function applyTactics(type) {
            if (type === 'attack') {
                tacticBonus = 0.3;
                document.getElementById('matchCommentary').innerText = "⚡ قمت بالتبديل الهجومي! الفريق بالكامل يضغط لتسجيل الأهداف.";
            } else if (type === 'defense') {
                tacticBonus = -0.25;
                document.getElementById('matchCommentary').innerText = "🛡️ قمت بالتحصين الدفاعي لإغلاق المساحات أمام الخصم.";
            }
        }

        // تشغيل تايمر الماتش
        let matchInterval = setInterval(() => {
            currentMinute += 3;
            if (currentMinute > 90) currentMinute = 90;

            document.getElementById('matchTimer').innerText = currentMinute + "'";

            if (currentMinute % 15 === 0) {
                let randomEvent = Math.random();
                let successChance = (squadPower > 80 ? 0.52 : 0.4) + tacticBonus;

                if (randomEvent < successChance) {
                    homeGoals++;
                    document.getElementById('homeScore').innerText = homeGoals;
                    document.getElementById('matchCommentary').innerHTML = `🔥 <span style='color:var(--gold);'>جـــــــــول لصالح ${userTeam}!</span> المهاجمون يترجمون السيطرة لهدف رائع!`;
                    document.getElementById('matchBall').style.left = '75%';
                } else if (randomEvent > 0.72 + (tacticBonus < 0 ? 0.15 : 0)) {
                    awayGoals++;
                    document.getElementById('awayScore').innerText = awayGoals;
                    document.getElementById('matchCommentary').innerHTML = `❌ <span style='color:var(--pink);'>هدف للخصم ${opponentTeam}!</span> استغلوا ثغرة وسجلوا بنجاح.`;
                    document.getElementById('matchBall').style.left = '25%';
                } else {
                    let randComm = commentaryList[Math.floor(Math.random() * commentaryList.length)];
                    document.getElementById('matchCommentary').innerText = randComm;
                    document.getElementById('matchBall').style.left = '50%';
                }
            }

            if (currentMinute >= 90) {
                clearInterval(matchInterval);
                setTimeout(saveAndExitMatch, 2000);
            }
        }, 1200);

        function finishMatchInstantly() {
            clearInterval(matchInterval);
            homeGoals = Math.floor(Math.random() * (squadPower > 85 ? 4 : 3));
            awayGoals = Math.floor(Math.random() * 2);
            document.getElementById('homeScore').innerText = homeGoals;
            document.getElementById('awayScore').innerText = awayGoals;
            document.getElementById('matchTimer').innerText = "90'";
            document.getElementById('matchCommentary').innerText = "صافرة النهاية الحاسمة!";
            
            setTimeout(saveAndExitMatch, 1500);
        }

        function saveAndExitMatch() {
            let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
            
            // تحديث جدول الدوري أو البطولة الحالية بانتظام وتجنب تخريف النتائج
            let currentMode = localStorage.getItem('careerMode') || 'league';
            
            if (currentMode === 'league') {
                let premierTeams = JSON.parse(localStorage.getItem('leagueStandings')) || [];
                let userObj = premierTeams.find(t => t.name === userTeam);
                if (userObj) {
                    userObj.played += 1;
                    if (homeGoals > awayGoals) { userObj.pts += 3; coins += 400; }
                    else if (homeGoals === awayGoals) { userObj.pts += 1; coins += 150; }
                }
                localStorage.setItem('leagueStandings', JSON.stringify(premierTeams));
                
                let currentRound = parseInt(localStorage.getItem('leagueRound')) || 1;
                localStorage.setItem('leagueRound', currentRound + 1);
            } 
            else if (currentMode === 'ucl') {
                let uclTeams = JSON.parse(localStorage.getItem('uclStandings')) || [];
                let userObj = uclTeams.find(t => t.name === userTeam);
                if (userObj) {
                    userObj.played += 1;
                    if (homeGoals > awayGoals) { userObj.pts += 3; coins += 800; }
                    else if (homeGoals === awayGoals) { userObj.pts += 1; coins += 300; }
                }
                localStorage.setItem('uclStandings', JSON.stringify(uclTeams));
                
                let uclRound = parseInt(localStorage.getItem('uclRound')) || 1;
                localStorage.setItem('uclRound', uclRound + 1);
            }

            localStorage.setItem('userCoins', coins);
            window.location.href = 'matches.html';
        }
    </script>

</body>
</html>
