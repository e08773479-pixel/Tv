<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Pro Soccer Field Live Match</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px 25px; text-align: center;
        }

        /* لوحة النتيجة العلوية */
        .scoreboard {
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--cyan);
            border-radius: 15px; padding: 10px 20px; display: flex; justify-content: space-around; align-items: center;
        }
        .team-name { font-size: 16px; font-weight: bold; color: var(--gold); }
        .score-box { font-size: 30px; font-weight: 900; color: var(--accent); background: rgba(0,0,0,0.8); padding: 2px 15px; border-radius: 10px; border: 1px solid var(--accent); }

        /* تصميم الملعب الاحترافي الحقيقي */
        .soccer-field {
            width: 100%; height: 230px;
            background: linear-gradient(180deg, #1b4d2e 0%, #133820 100%);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
        }

        /* خطوط الملعب */
        .field-center-line {
            position: absolute; width: 2px; height: 100%; background: rgba(255,255,255,0.4);
        }
        .field-center-circle {
            position: absolute; width: 70px; height: 70px; border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
        }
        .goal-box-left {
            position: absolute; left: 0; width: 45px; height: 110px; border: 2px solid rgba(255,255,255,0.4);
            border-left: none; top: 50%; transform: translateY(-50%);
        }
        .goal-box-right {
            position: absolute; right: 0; width: 45px; height: 110px; border: 2px solid rgba(255,255,255,0.4);
            border-right: none; top: 50%; transform: translateY(-50%);
        }

        /* كرة القدم الحية التي تتحرك على الملعب */
        .live-ball {
            position: absolute; width: 22px; height: 22px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 15px #fff;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            transition: all 0.6s ease-in-out;
            font-size: 14px; display: flex; align-items: center; justify-content: center;
        }

        /* صندوق التعليق الحي */
        .live-commentary {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px; height: 110px; padding: 10px; overflow-y: auto;
            color: var(--text-main); font-size: 12px; text-align: right; line-height: 1.5;
        }
        .live-commentary::-webkit-scrollbar { width: 4px; }
        .live-commentary::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .control-panel { display: flex; gap: 10px; justify-content: center; align-items: center; }

        .action-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none; color: #020408; padding: 10px 25px; border-radius: 20px;
            font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 0 15px var(--accent-glow);
            transition: 0.3s;
        }
        .action-btn:hover { transform: scale(1.03); }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="scoreboard">
            <div>
                <div class="team-name" id="homeTeamName">ناديك</div>
                <div style="font-size: 10px; color: var(--cyan);">قوة التشكيلة: <span id="squadPowerDisplay">92</span> ⭐</div>
            </div>
            <div class="score-box"><span id="homeGoals">0</span> : <span id="awayGoals">0</span></div>
            <div>
                <div class="team-name" id="awayTeamName">الخصم</div>
                <div style="font-size: 10px; color: var(--pink);">معركة الملعب</div>
            </div>
        </div>

        <div class="soccer-field" id="soccerField">
            <div class="field-center-line"></div>
            <div class="field-center-circle"></div>
            <div class="goal-box-left"></div>
            <div class="goal-box-right"></div>
            
            <div class="live-ball" id="liveBall">⚽</div>
        </div>

        <div class="live-commentary" id="commentaryBox">
            <div>🚀 صافرة البداية! اللاعبون على أرضية الملعب الأخضر وجاهزون للانطلاق...</div>
        </div>

        <div class="control-panel">
            <button id="matchActionBtn" class="action-btn" onclick="simulateMatchStep()">▶️ تقدم الدقائق وتحريك الكرة والهجمات ⚡</button>
        </div>

        <div>
            <a href="matches.html" id="backToTableBtn" style="color: var(--cyan); font-weight: bold; text-decoration: none; display: none; font-size: 13px;">← العودة لجدول الترتيب والبطولات وتحديث النقاط</a>
        </div>
    </div>

    <script>
        let userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        let opponentTeam = localStorage.getItem('currentOpponent') || 'الخصم المنافس';
        let squadPower = parseInt(localStorage.getItem('userSquadPower')) || 92;

        let optimizedSquad = JSON.parse(localStorage.getItem('optimizedSquad')) || [];
        let playerNames = optimizedSquad.map(p => p.name).filter(Boolean);
        if (playerNames.length === 0) playerNames = ["نجم الهجوم", "المايسترو", "صاروخ الدفاع", "حارس الأساطير"];

        document.getElementById('homeTeamName').innerText = userTeam;
        document.getElementById('awayTeamName').innerText = opponentTeam;
        document.getElementById('squadPowerDisplay').innerText = squadPower;

        let homeGoals = 0;
        let awayGoals = 0;
        let minute = 0;
        let matchFinished = false;

        function simulateMatchStep() {
            if (matchFinished) return;

            minute += 15;
            if (minute > 90) minute = 90;

            let randomStar = playerNames[Math.floor(Math.random() * playerNames.length)];
            let commentary = document.getElementById('commentaryBox');
            let ball = document.getElementById('liveBall');

            // تحريك الكرة عشوائياً في الملعب بصرياً
            let randomX = Math.floor(Math.random() * 70) - 35; 
            let randomY = Math.floor(Math.random() * 50) - 25;
            ball.style.transform = `translate(${randomX}%, ${randomY}%) scale(1.2)`;
            setTimeout(() => ball.style.transform = `translate(0, 0) scale(1)`, 400);

            let successChance = squadPower >= 95 ? 0.75 : 0.55;

            if (Math.random() < successChance) {
                homeGoals += 1;
                commentary.innerHTML += `<div style="color:var(--accent);">⚽ **هدف رائع!** النجم **${randomStar}** يخترق ويسدد في الدقيقة ${minute}! اشتعلت الشباك لصالح ${userTeam}! 🔥</div>`;
            } else if (Math.random() < 0.3) {
                awayGoals += 1;
                commentary.innerHTML += `<div style="color:var(--pink);">⚠️ هجمة مرتدة خطيرة للخصم، وسجلوا هدفاً في الدقيقة ${minute}.</div>`;
            } else {
                commentary.innerHTML += `<div>⏱️ الدقيقة ${minute}: هجمة منظمة يقودها **${nameFilter(randomStar)}** وتمريرات ساحرة في وسط الملعب.</div>`;
            }

            document.getElementById('homeGoals').innerText = homeGoals;
            document.getElementById('awayGoals').innerText = awayGoals;
            commentary.scrollTop = commentary.scrollHeight;

            if (minute === 90) {
                matchFinished = true;
                document.getElementById('matchActionBtn').innerText = "🏁 صافرة النهاية! حفظ النتيجة وتحديث الجدول";
                saveMatchResultToStandings();
            }
        }

        function nameFilter(n) { return n; }

        function saveMatchResultToStandings() {
            let resultType = 'draw';
            if (homeGoals > awayGoals) resultType = 'win';
            else if (homeGoals < awayGoals) resultType = 'loss';

            let careerMode = localStorage.getItem('careerMode') || 'league';

            if (careerMode === 'league') {
                let premier20 = JSON.parse(localStorage.getItem('premierLeague20')) || [];
                let userObj = premier20.find(t => t.name === userTeam);
                if (userObj) {
                    userObj.played += 1;
                    if (resultType === 'win') userObj.pts += 3;
                    else if (resultType === 'draw') userObj.pts += 1;

                    premier20.forEach(t => {
                        if (t.name !== userTeam) {
                            t.played += 1;
                            let r = Math.random();
                            if (r > 0.5) t.pts += 3;
                            else if (r > 0.2) t.pts += 1;
                        }
                    });
                }
                let leagueRound = parseInt(localStorage.getItem('leagueRound')) || 1;
                leagueRound++;
                if (leagueRound > 38) leagueRound = 38;
                localStorage.setItem('leagueRound', leagueRound);
                localStorage.setItem('premierLeague20', JSON.stringify(premier20));
            } else {
                let ucl32 = JSON.parse(localStorage.getItem('uclLeague32')) || [];
                let userObj = ucl32.find(t => t.name === userTeam);
                if (userObj) {
                    userObj.played += 1;
                    if (resultType === 'win') userObj.pts += 3;
                    else if (resultType === 'draw') userObj.pts += 1;

                    ucl32.forEach(t => {
                        if (t.name !== userTeam) {
                            t.played += 1;
                            let r = Math.random();
                            if (r > 0.5) t.pts += 3;
                            else if (r > 0.2) t.pts += 1;
                        }
                    });
                }
                let uclRound = parseInt(localStorage.getItem('uclRound')) || 1;
                uclRound++;
                if (uclRound > 31) uclRound = 31;
                localStorage.setItem('uclRound', uclRound);
                localStorage.setItem('uclLeague32', JSON.stringify(ucl32));
            }

            document.getElementById('matchActionBtn').style.display = 'none';
            document.getElementById('backToTableBtn').style.display = 'inline-block';
        }
    </script>

</body>
</html>
