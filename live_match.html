<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Ultimate Live Match Commentary & Squad Engine</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px 30px; text-align: center;
        }

        .scoreboard {
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--cyan);
            border-radius: 20px; padding: 15px; display: flex; justify-content: space-around; align-items: center;
        }

        .team-name { font-size: 18px; font-weight: bold; color: var(--gold); }
        .score-box { font-size: 38px; font-weight: 900; color: var(--accent); background: rgba(0,0,0,0.8); padding: 2px 20px; border-radius: 12px; border: 1px solid var(--accent); }

        .live-commentary {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 15px; height: 190px; padding: 15px; overflow-y: auto;
            color: var(--text-main); font-size: 13px; text-align: right; line-height: 1.6;
        }
        .live-commentary::-webkit-scrollbar { width: 5px; }
        .live-commentary::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .control-panel { display: flex; gap: 15px; justify-content: center; align-items: center; }

        .action-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none; color: #020408; padding: 12px 25px; border-radius: 25px;
            font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 0 20px var(--accent-glow);
            transition: 0.3s;
        }
        .action-btn:hover { transform: scale(1.03); }

        .tactics-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 8px 15px; border-radius: 12px; font-size: 12px; color: var(--gold); display: flex; gap: 15px; justify-content: center;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div style="font-size: 15px; font-weight: bold; color: var(--gold);">🏟️ الماتش الحي الحماسي - تفاعل نجوم تشكيلتك</div>

        <div class="scoreboard">
            <div>
                <div class="team-name" id="homeTeamName">ناديك</div>
                <div style="font-size: 11px; color: var(--cyan);">قوة التشكيلة: <span id="squadPowerDisplay">90</span> ⭐</div>
            </div>
            <div class="score-box"><span id="homeGoals">0</span> : <span id="awayGoals">0</span></div>
            <div>
                <div class="team-name" id="awayTeamName">الخصم</div>
                <div style="font-size: 11px; color: var(--pink);">معركة حاسمة</div>
            </div>
        </div>

        <div class="tactics-box">
            <div>⚡ العقلية: <span id="currentTactics" style="color:#fff;">هجوم ضاغط 🚀</span></div>
            <div>🛡️ الحالة البدنية: <span style="color:var(--accent);">ممتازة 100%</span></div>
        </div>

        <div class="live-commentary" id="commentaryBox">
            <div>🚀 صافرة البداية! اللاعبين في الملعب وجاهزون لحسم اللقاء لصالح ناديك...</div>
        </div>

        <div class="control-panel">
            <button id="matchActionBtn" class="action-btn" onclick="simulateMatchStep()">▶️ ضغطة لتقدم الدقائق وهجمات الأساطير</button>
            <button class="action-btn" style="background: linear-gradient(45deg, var(--pink), var(--gold)); color:#fff;" onclick="changeTactics()">🔄 تبديل التكتيك (هجوم/دفاع)</button>
        </div>

        <div>
            <a href="matches.html" id="backToTableBtn" style="color: var(--cyan); font-weight: bold; text-decoration: none; display: none; font-size: 14px;">← العودة لجدول الترتيب والبطولات وتحديث النقاط</a>
        </div>
    </div>

    <script>
        let userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        let opponentTeam = localStorage.getItem('currentOpponent') || 'الخصم المنافس';
        let squadPower = parseInt(localStorage.getItem('userSquadPower')) || 92;

        // جلب أسماء لاعبي تشكيلة المستخدم الحقيقيين لذكرهم في التعليق الحماسي
        let optimizedSquad = JSON.parse(localStorage.getItem('optimizedSquad')) || [];
        let playerNames = optimizedSquad.map(p => p.name).filter(Boolean);
        if (playerNames.length === 0) playerNames = ["نجم الهجوم الأول", "المايسترو", "صاروخ الدفاع", "حارس الأساطير"];

        document.getElementById('homeTeamName').innerText = userTeam;
        document.getElementById('awayTeamName').innerText = opponentTeam;
        document.getElementById('squadPowerDisplay').innerText = squadPower;

        let homeGoals = 0;
        let awayGoals = 0;
        let minute = 0;
        let matchFinished = false;
        let tacticMode = 'attack'; // attack, defense, balanced

        function changeTactics() {
            if (matchFinished) return;
            const tacticsText = document.getElementById('currentTactics');
            if (tacticMode === 'attack') {
                tacticMode = 'balanced';
                tacticsText.innerText = "توازن وسط الملعب ⚖️";
            } else if (tacticMode === 'balanced') {
                tacticMode = 'defense';
                tacticsText.innerText = "دفاع حصين وتأمين 🛡️";
            } else {
                tacticMode = 'attack';
                tacticsText.innerText = "هجوم ضاغط ناري 🚀";
            }
        }

        function simulateMatchStep() {
            if (matchFinished) return;

            minute += 15;
            if (minute > 90) minute = 90;

            let randomStar = playerNames[Math.floor(Math.random() * playerNames.length)];
            let commentary = document.getElementById('commentaryBox');

            // حساب فرص التهديف بناءً على قوة التشكيلة وتكتيك اللاعب
            let successChance = squadPower >= 95 ? 0.75 : 0.55;
            if (tacticMode === 'attack') successChance += 0.15;
            if (tacticMode === 'defense') successChance -= 0.1;

            if (Math.random() < successChance) {
                homeGoals += 1;
                commentary.innerHTML += `<div style="color:var(--accent);">⚽ **هدفرائع!** النجم **${randomStar}** يسدد صاروخية لا ترد في الدقيقة ${minute}! تسطو على الشباك لصالح ${userTeam}! 🔥</div>`;
            } else if (Math.random() < 0.3) {
                awayGoals += 1;
                commentary.innerHTML += `<div style="color:var(--pink);">⚠️ هجمة مرتدة خطيرة للخصم، ويسجلون هدفاً في الدقيقة ${minute}.</div>`;
            } else {
                commentary.innerHTML += `<div>⏱️ الدقيقة ${minute}: ضغط قوي من **${randomStar}** وتمريرات متقنة في منتصف الملعب، اللعب اشتعل!</div>`;
            }

            document.getElementById('homeGoals').innerText = homeGoals;
            document.getElementById('awayGoals').innerText = awayGoals;
            commentary.scrollTop = commentary.scrollHeight;

            if (minute === 90) {
                matchFinished = true;
                document.getElementById('matchActionBtn').innerText = "🏁 صافرة النهاية! تم حفظ النتيجة وتحديث جدول الترتيب";
                saveMatchResultToStandings();
            }
        }

        function saveMatchResultToStandings() {
            let resultType = 'draw';
            if (homeGoals > awayGoals) resultType = 'win';
            else if (homeGoals < awayGoals) resultType = 'loss';

            let careerMode = localStorage.getItem('careerMode') || 'league';

            if (careerMode === 'league') {
                let premier20 = JSON.parse(localStorage.getItem('premierLeague20')) || [];
                let userObj = premier20.find(t => t.name === userTeam);
                if (userObj) {
                    userObj.played += 1;
                    if (resultType === 'win') userObj.pts += 3;
                    else if (resultType === 'draw') userObj.pts += 1;

                    // محاكاة سريعة لباقي فرق الدوري الـ 20
                    premier20.forEach(t => {
                        if (t.name !== userTeam) {
                            t.played += 1;
                            let r = Math.random();
                            if (r > 0.5) t.pts += 3;
                            else if (r > 0.2) t.pts += 1;
                        }
                    });
                }
                let leagueRound = parseInt(localStorage.getItem('leagueRound')) || 1;
                leagueRound++;
                if (leagueRound > 38) leagueRound = 38;
                localStorage.setItem('leagueRound', leagueRound);
                localStorage.setItem('premierLeague20', JSON.stringify(premier20));
            } else {
                // دوري أبطال أوروبا (32 فريق - 31 ماتش مرحلة الدوري ثم أول 16 للإقصائيات)
                let ucl32 = JSON.parse(localStorage.getItem('uclLeague32')) || [];
                let userObj = ucl32.find(t => t.name === userTeam);
                if (userObj) {
                    userObj.played += 1;
                    if (resultType === 'win') userObj.pts += 3;
                    else if (resultType === 'draw') userObj.pts += 1;

                    ucl32.forEach(t => {
                        if (t.name !== userTeam) {
                            t.played += 1;
                            let r = Math.random();
                            if (r > 0.5) t.pts += 3;
                            else if (r > 0.2) t.pts += 1;
                        }
                    });
                }
                let uclRound = parseInt(localStorage.getItem('uclRound')) || 1;
                uclRound++;
                if (uclRound > 31) {
                    ucl32.sort((a, b) => b.pts - a.pts);
                    let userRank = ucl32.findIndex(t => t.name === userTeam) + 1;
                    if (userRank <= 16) {
                        alert(`🌟 إنجاز تاريخي! أنهيت مرحلة دوري الأبطال في المركز ${userRank} وتأهلت رسمياً لدور الـ 16 (مرحلة الإقصائيات بنظام الذهاب والعودة)!`);
                    } else {
                        alert(`تم إقصاؤك من دوري الأبطال بعد إنهاء مرحلة الدوري في المركز ${userRank}.`);
                    }
                    uclRound = 31;
                }
                localStorage.setItem('uclRound', uclRound);
                localStorage.setItem('uclLeague32', JSON.stringify(ucl32));
            }

            document.getElementById('matchActionBtn').style.display = 'none';
            document.getElementById('backToTableBtn').style.display = 'inline-block';
        }
    </script>

</body>
</html>
