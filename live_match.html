<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Live Match Engine</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --gold: #ffd700;
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px 30px; text-align: center;
        }

        .scoreboard {
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--cyan);
            border-radius: 20px; padding: 20px; display: flex; justify-content: space-around; align-items: center;
        }

        .team-name { font-size: 20px; font-weight: bold; color: var(--gold); }
        .score-box { font-size: 40px; font-weight: 900; color: var(--accent); background: rgba(0,0,0,0.8); padding: 5px 25px; border-radius: 15px; border: 1px solid var(--accent); }

        .live-commentary {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; height: 180px; padding: 15px; overflow-y: auto;
            color: var(--text-main); font-size: 13px; text-align: right; line-height: 1.6;
        }

        .action-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none; color: #020408; padding: 12px 30px; border-radius: 25px;
            font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,136,0.5);
            transition: 0.3s;
        }
        .action-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div style="font-size: 16px; font-weight: bold; color: var(--gold);">🏟️ أرضية الملعب - الماتش الحي الحاسم</div>

        <div class="scoreboard">
            <div>
                <div class="team-name" id="homeTeamName">ناديك</div>
                <div style="font-size: 11px; color: var(--cyan);">قوة التشكيلة: <span id="squadPowerDisplay">85</span> ⭐</div>
            </div>
            <div class="score-box"><span id="homeGoals">0</span> : <span id="awayGoals">0</span></div>
            <div>
                <div class="team-name" id="awayTeamName">الخصم</div>
                <div style="font-size: 11px; color: var(--pink);">دوري أبطال / محلي</div>
            </div>
        </div>

        <div class="live-commentary" id="commentaryBox">
            <div>🚀 صافرة البداية! تبدأ أحداث اللقاء الناري الآن...</div>
        </div>

        <div>
            <button id="matchActionBtn" class="action-btn" onclick="simulateMatchStep()">محاكاة الأجواء وتقدم الدقائق ⚡</button>
        </div>

        <div>
            <a href="matches.html" id="backToTableBtn" style="color: var(--cyan); font-weight: bold; text-decoration: none; display: none;">← العودة لجدول الترتيب والبطولات</a>
        </div>
    </div>

    <script>
        let userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        let opponentTeam = localStorage.getItem('currentOpponent') || 'الخصم المنافس';
        let squadPower = parseInt(localStorage.getItem('userSquadPower')) || 85;

        document.getElementById('homeTeamName').innerText = userTeam;
        document.getElementById('awayTeamName').innerText = opponentTeam;
        document.getElementById('squadPowerDisplay').innerText = squadPower;

        let homeGoals = 0;
        let awayGoals = 0;
        let minute = 0;
        let matchFinished = false;

        function simulateMatchStep() {
            if (matchFinished) return;

            minute += 15;
            if (minute > 90) minute = 90;

            // حساب الأهداف بناءً على قوة التشكيلة الخاصة بك
            let powerFactor = squadPower >= 95 ? 0.7 : (squadPower >= 90 ? 0.5 : 0.3);
            if (Math.random() < powerFactor) homeGoals += Math.floor(Math.random() * 2);
            if (Math.random() < 0.35) awayGoals += Math.floor(Math.random() * 2);

            document.getElementById('homeGoals').innerText = homeGoals;
            document.getElementById('awayGoals').innerText = awayGoals;

            let commentary = document.getElementById('commentaryBox');
            commentary.innerHTML += `<div>⏱️ الدقيقة ${minute}: هجمة منظمة، النتيجة الحالية ${homeGoals} مقابل ${awayGoals}...</div>`;
            commentary.scrollTop = commentary.scrollHeight;

            if (minute === 90) {
                matchFinished = true;
                document.getElementById('matchActionBtn').innerText = "🏁 نهاية اللقاء! حفظ النتيجة وتحديث الجدول";
                processMatchResultAndSave();
            }
        }

        function processMatchResultAndSave() {
            let resultType = 'draw';
            if (homeGoals > awayGoals) resultType = 'win';
            else if (homeGoals < awayGoals) resultType = 'loss';

            let currentMode = localStorage.getItem('careerMode') || 'league';

            if (currentMode === 'league') {
                let premier20 = JSON.parse(localStorage.getItem('premierLeague20')) || [];
                let userObj = premier20.find(t => t.name === userTeam);
                if (userObj) {
                    userObj.played += 1;
                    if (resultType === 'win') userObj.pts += 3;
                    else if (resultType === 'draw') userObj.pts += 1;

                    // تحديث باقي الفرق عشوائياً لواقعية الدوري
                    premier20.forEach(t => {
                        if (t.name !== userTeam) {
                            t.played += 1;
                            let r = Math.random();
                            if (r > 0.6) t.pts += 3;
                            else if (r > 0.3) t.pts += 1;
                        }
                    });
                }
                let leagueRound = parseInt(localStorage.getItem('leagueRound')) || 1;
                leagueRound++;
                if (leagueRound > 38) leagueRound = 38;
                localStorage.setItem('leagueRound', leagueRound);
                localStorage.setItem('premierLeague20', JSON.stringify(premier20));

            } else {
                // دوري أبطال أوروبا
                let uclPhase = localStorage.getItem('uclPhase') || 'league';
                let ucl32 = JSON.parse(localStorage.getItem('uclLeague32')) || [];

                if (uclPhase === 'league') {
                    let userObj = ucl32.find(t => t.name === userTeam);
                    if (userObj) {
                        userObj.played += 1;
                        if (resultType === 'win') userObj.pts += 3;
                        else if (resultType === 'draw') userObj.pts += 1;

                        ucl32.forEach(t => {
                            if (t.name !== userTeam) {
                                t.played += 1;
                                let r = Math.random();
                                if (r > 0.6) t.pts += 3;
                                else if (r > 0.3) t.pts += 1;
                            }
                        });
                    }
                    let uclRound = parseInt(localStorage.getItem('uclRound')) || 1;
                    uclRound++;
                    if (uclRound > 8) {
                        // انتهاء مرحلة الدوري، التحقق من تأهل أول 8 فرق لأدوار الإقصاء
                        ucl32.sort((a, b) => b.pts - a.pts);
                        let userRank = ucl32.findIndex(t => t.name === userTeam) + 1;
                        if (userRank <= 8) {
                            localStorage.setItem('uclPhase', 'r16_first'); // تأهل لدور الـ 16
                            alert(`🌟 مبروك! أنهيت مرحلة الدوري في المركز ${userRank} وتأهلت رسمياً إلى دور الـ 16 (مرحلة الإقصائيات بنظام الذهاب والعودة)!`);
                        } else {
                            alert(`تم إقصاؤك من دوري أبطال أوروبا بعد إنهاء مرحلة الدوري في المركز ${userRank}.`);
                            localStorage.setItem('uclPhase', 'league');
                        }
                        uclRound = 8;
                    }
                    localStorage.setItem('uclRound', uclRound);
                    localStorage.setItem('uclLeague32', JSON.stringify(ucl32));
                } else {
                    // إدارة مراحل الإقصاء (دور 16، ربع، نصف، نهائي ذهاب وعودة)
                    if (resultType === 'win' || resultType === 'draw') {
                        if (uclPhase === 'r16_first') localStorage.setItem('uclPhase', 'r16_second');
                        else if (uclPhase === 'r16_second') localStorage.setItem('uclPhase', 'qf_first');
                        else if (uclPhase === 'qf_first') localStorage.setItem('uclPhase', 'qf_second');
                        else if (uclPhase === 'qf_second') localStorage.setItem('uclPhase', 'sf_first');
                        else if (uclPhase === 'sf_first') localStorage.setItem('uclPhase', 'sf_second');
                        else if (uclPhase === 'sf_second') localStorage.setItem('uclPhase', 'final');
                        else if (uclPhase === 'final') {
                            alert('🏆 مبروك أسطورة! لقد توجت رسمياً بلقب دوري أبطال أوروبا الخرافي!');
                            localStorage.setItem('uclPhase', 'league');
                        }
                    } else {
                        alert('❌ خسارة مواجهة الإقصاء! تم خروجك من البطولة.');
                        localStorage.setItem('uclPhase', 'league');
                    }
                }
            }

            document.getElementById('matchActionBtn').style.display = 'none';
            document.getElementById('backToTableBtn').style.display = 'inline-block';
        }
    </script>

</body>
</html>
