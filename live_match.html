<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Pro Live Match & Tactics Engine</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }
        
        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px 25px;
        }

        /* شريط نتيجة المباراة الحي */
        .live-scoreboard {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.7); border: 2px solid var(--accent);
            padding: 8px 20px; border-radius: 18px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .team-display { font-size: 16px; font-weight: 900; color: var(--cyan); }
        .score-display { font-size: 26px; font-weight: 900; color: var(--gold); }
        
        .timer-box {
            background: var(--pink); color: #fff; padding: 4px 12px; border-radius: 15px;
            font-size: 16px; font-weight: bold; box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
            animation: pulseTimer 1.5s infinite;
        }
        @keyframes pulseTimer { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* الملعب الحقيقي وتفاعل اللعيبة */
        .live-pitch {
            background: linear-gradient(180deg, rgba(0, 90, 35, 0.85), rgba(0, 45, 15, 0.95));
            border: 2px solid var(--gold); border-radius: 18px;
            height: 310px; position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 12px; box-shadow: inset 0 0 40px rgba(0, 255, 136, 0.3);
        }

        .pitch-center-circle {
            position: absolute; width: 90px; height: 90px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .commentary-box {
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--cyan);
            padding: 8px 15px; border-radius: 12px; color: var(--text-main);
            font-size: 14px; font-weight: bold; text-align: center; width: 85%;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); z-index: 5;
        }

        .players-simulation-area {
            position: relative; width: 100%; height: 160px; display: flex; justify-content: space-around; align-items: center;
        }

        .live-player-card {
            background: rgba(0, 0, 0, 0.75); border: 2px solid var(--gold);
            padding: 6px 10px; border-radius: 12px; text-align: center; color: #fff;
            font-size: 11px; font-weight: bold; box-shadow: 0 0 10px var(--gold-glow);
            animation: bouncePlayer 2s infinite ease-in-out;
        }
        @keyframes bouncePlayer { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .ball-icon {
            font-size: 24px; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); transition: 0.5s ease;
            filter: drop-shadow(0 0 10px #fff);
        }

        /* لوحة التحكم والتبديلات أثناء الماتش */
        .tactics-control-panel {
            display: flex; gap: 10px; width: 100%; justify-content: center; align-items: center;
        }

        .tactic-btn {
            background: rgba(0, 240, 255, 0.15); border: 1px solid var(--cyan);
            color: var(--cyan); padding: 6px 14px; border-radius: 15px; font-weight: bold;
            font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .tactic-btn:hover { background: var(--cyan); color: #020408; }

        .skip-btn {
            background: linear-gradient(45deg, var(--gold), #ffaa00); border: none;
            color: #020408; padding: 6px 16px; border-radius: 15px; font-weight: 900;
            font-size: 12px; cursor: pointer; box-shadow: 0 0 10px var(--gold-glow); transition: 0.2s;
        }
        .skip-btn:hover { transform: scale(1.03); }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="live-scoreboard">
            <div id="homeTeamName" class="team-display">ناديك</div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="homeScore" class="score-display">0</span>
                <span style="color:var(--pink); font-size:18px;">-</span>
                <span id="awayScore" class="score-display">0</span>
            </div>
            <div id="awayTeamName" class="team-display" style="color: var(--pink);">الخصم</div>
            <div id="matchTimer" class="timer-box">00'</div>
        </div>

        <div class="live-pitch">
            <div class="pitch-center-circle"></div>
            
            <div id="matchCommentary" class="commentary-box">صافرة البداية! الماتش اشتعل الآن بين الفريقين...</div>

            <div class="players-simulation-area">
                <div class="live-player-card">
                    <div style="color: var(--cyan);">نجوم ناديك ⚽</div>
                    <div id="activeAttacker" style="font-size: 9px; color: var(--gold);">جاهزون للهجوم</div>
                </div>

                <div id="matchBall" class="ball-icon">⚽</div>

                <div class="live-player-card" style="border-color: var(--pink);">
                    <div style="color: var(--pink);">دفاع الخصم 🛡️</div>
                    <div id="activeDefender" style="font-size: 9px; color: #aaa;">تغطية محكمة</div>
                </div>
            </div>

            <div class="tactics-control-panel">
                <button class="tactic-btn" onclick="applyTactics('attack')">⚡ تبديل هجومي مكثف</button>
                <button class="tactic-btn" onclick="applyTactics('defense')">🛡️ تحصين دفاعي صارم</button>
                <button class="skip-btn" onclick="finishMatchInstantly()">إنهاء سريع ⏩</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 11px; color: rgba(255,255,255,0.5);">Joker Live Tactics Engine</div>
            <div style="font-size: 11px; color: var(--accent);">تحكم مباشر في اللقاء</div>
        </div>
    </div>

    <script>
        const userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        const opponentTeam = localStorage.getItem('currentOpponent') || 'الخصم القوي';
        
        document.getElementById('homeTeamName').innerText = userTeam;
        document.getElementById('awayTeamName').innerText = opponentTeam;

        let homeGoals = 0;
        let awayGoals = 0;
        let currentMinute = 0;
        let tacticBonus = 0; // تأثير تكتيكات المدرب

        let myPlayers = JSON.parse(localStorage.getItem('myTeamPlayers')) || [];
        let squadPower = myPlayers.reduce((sum, p) => sum + (p.rating || 75), 0) / (myPlayers.length || 1);
        if (myPlayers.length === 0) squadPower = 70;

        let commentaryList = [
            "هجمة مرتدة خطيرة وصاروخية!",
            "تمريرات قصيرة رائعة في منتصف الملعب...",
            "الكرة تنحصر في وسط الميدان وسط صراع شرس.",
            "فرصة محققة تهدر بغرابة أمام المرمى!",
            "عرضية متقنة لكن الحارس يبعدها ببراعة."
        ];

        function applyTactics(type) {
            if (type === 'attack') {
                tacticBonus = 0.25;
                document.getElementById('matchCommentary.innerHTML').innerText = "⚠️ قمت بالدفع بمهاجمين إضافيين! الهجوم اشتعل!";
            } else if (type === 'defense') {
                tacticBonus = -0.2;
                document.getElementById('matchCommentary').innerText = "🔒 قمت بتأمين الدفاع بصرامة لصد هجمات الخصم!";
            }
        }

        // تشغيل التايمر (90 دقيقة)
        let matchInterval = setInterval(() => {
            currentMinute += 3;
            if (currentMinute > 90) currentMinute = 90;

            document.getElementById('matchTimer').innerText = currentMinute + "'";

            if (currentMinute % 15 === 0) {
                let randomEvent = Math.random();
                let successChance = (squadPower > 82 ? 0.55 : 0.4) + tacticBonus;

                if (randomEvent < successChance) {
                    homeGoals++;
                    document.getElementById('homeScore').innerText = homeGoals;
                    document.getElementById('matchCommentary').innerHTML = `🔥 <span style='color:var(--gold);'>هدف لصالح ${userTeam}!</span> تكتيكك نجح وهز الشباك!`;
                    document.getElementById('matchBall').style.left = '80%';
                } else if (randomEvent > 0.75 + (tacticBonus < 0 ? 0.15 : 0)) {
                    awayGoals++;
                    document.getElementById('awayScore').innerText = awayGoals;
                    document.getElementById('matchCommentary').innerHTML = `❌ <span style='color:var(--pink);'>هدف للخصم ${opponentTeam}!</span> استغلوا ثغرة وسجلوا.`;
                    document.getElementById('matchBall').style.left = '20%';
                } else {
                    let randComm = commentaryList[Math.floor(Math.random() * commentaryList.length)];
                    document.getElementById('matchCommentary').innerText = randComm;
                    document.getElementById('matchBall').style.left = '50%';
                }
            }

            if (currentMinute >= 90) {
                clearInterval(matchInterval);
                setTimeout(saveAndExitMatch, 2000);
            }
        }, 1500);

        function finishMatchInstantly() {
            clearInterval(matchInterval);
            homeGoals = Math.floor(Math.random() * (squadPower > 85 ? 4 : 3));
            awayGoals = Math.floor(Math.random() * 3);
            document.getElementById('homeScore').innerText = homeGoals;
            document.getElementById('awayScore').innerText = awayGoals;
            document.getElementById('matchTimer').innerText = "90'";
            document.getElementById('matchCommentary').innerText = "صافرة النهاية الحاسمة!";
            
            setTimeout(saveAndExitMatch, 1500);
        }

        function saveAndExitMatch() {
            let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
            let premierTeams = JSON.parse(localStorage.getItem('leagueStandings')) || [];
            
            let userObj = premierTeams.find(t => t.name === userTeam);
            if (userObj) {
                userObj.played += 1;
                if (homeGoals > awayGoals) {
                    userObj.pts += 3;
                    coins += 400;
                } else if (homeGoals === awayGoals) {
                    userObj.pts += 1;
                    coins += 150;
                }
            }

            localStorage.setItem('userCoins', coins);
            localStorage.setItem('leagueStandings', JSON.stringify(premierTeams));
            window.location.href = 'matches.html';
        }
    </script>

</body>
</html>
