<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Club Squad</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --text-main: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-viewport {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 35px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 10px 20px;
            border-radius: 15px;
        }

        .squad-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* حاوية قائمة اللاعبين */
        .players-container {
            width: 100%;
            height: 380px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 18px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .players-container::-webkit-scrollbar {
            width: 8px;
        }
        .players-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        .player-row {
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.9) 0%, rgba(20, 40, 65, 0.95) 100%);
            border: 2px solid rgba(0, 255, 136, 0.4);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            font-weight: bold;
        }

        .empty-squad {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 120px;
            font-size: 18px;
        }

        .back-btn {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            padding: 8px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .back-btn:hover {
            background: var(--cyan);
            color: #020408;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div class="squad-title">📋 تشكيلة النادي واللاعبين المتاحين</div>
            <div style="color: var(--gold); font-weight: bold;" id="totalPlayersCount">العدد: 0</div>
        </div>

        <div id="squadList" class="players-container">
            </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <div style="font-size: 13px; color: rgba(255,255,255,0.5);">Joker Squad Management</div>
        </div>
    </div>

    <script>
        // استدعاء اللاعبين المحفوظين من الـ LocalStorage
        let myPlayers = JSON.parse(localStorage.getItem('myTeamPlayers')) || [];
        const squadContainer = document.getElementById('squadList');
        document.getElementById('totalPlayersCount').innerText = "العدد: " + myPlayers.length;

        if (myPlayers.length === 0) {
            squadContainer.innerHTML = '<div class="empty-squad">ليس لديك لاعبون حتى الآن! اذهب إلى المتجر وافتح الباكيدجات للحصول على أساطير.</div>';
        } else {
            squadContainer.innerHTML = '';
            myPlayers.forEach((player, index) => {
                squadContainer.innerHTML += `
                    <div class="player-row">
                        <div><span>⚽</span> ${player.name}</div>
                        <div style="display: flex; gap: 20px;">
                            <span style="color: var(--cyan);">المركز: ${player.pos}</span>
                            <span style="color: var(--gold);">الطاقة: ${player.rating}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>

</body>
</html>
