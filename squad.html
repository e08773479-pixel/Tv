<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Ultimate Squad & Pitch</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-viewport {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 8px 20px;
            border-radius: 15px;
        }

        .squad-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent);
        }

        /* حاوية التشكيلة والملعب */
        .squad-main-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 15px;
            height: 410px;
        }

        /* تصميم الملعب الأخضر الاحترافي */
        .football-pitch {
            background: linear-gradient(180deg, rgba(0, 80, 30, 0.8), rgba(0, 50, 20, 0.9));
            border: 2px solid var(--accent);
            border-radius: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 15px;
            box-shadow: inset 0 0 30px rgba(0, 255, 136, 0.3);
            overflow: hidden;
        }

        .pitch-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            top: 50%;
        }

        .pitch-circle {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* مراكز اللاعبين في الملعب (خطة 4-3-3) */
        .line-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 2;
            width: 100%;
        }

        .player-slot {
            background: rgba(0, 0, 0, 0.7);
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 6px 12px;
            text-align: center;
            color: var(--text-main);
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            min-width: 90px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .player-slot:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.2);
        }

        /* قائمة اللاعبين المتاحة (من المتجر) */
        .bench-container {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bench-title {
            font-size: 14px;
            color: var(--cyan);
            font-weight: bold;
            text-align: center;
        }

        .bench-list {
            overflow-y: auto;
            height: 330px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bench-list::-webkit-scrollbar { width: 5px; }
        .bench-list::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; }

        .bench-player-card {
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.9), rgba(20, 40, 65, 0.9));
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            font-size: 13px;
        }

        .select-btn {
            background: var(--accent);
            border: none;
            color: #020408;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .select-btn:hover {
            background: var(--cyan);
        }

        .back-btn {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            padding: 6px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div class="squad-title">📋 إدارة التشكيلة والملعب (خطة 4-3-3)</div>
            <div id="teamOverall" style="color: var(--gold); font-weight: bold;">تقييم الفريق: 0</div>
        </div>

        <div class="squad-main-layout">
            <div class="football-pitch">
                <div class="pitch-line"></div>
                <div class="pitch-circle"></div>

                <div class="line-row">
                    <div class="player-slot" id="pos_LW" onclick="assignPlayerToSlot('LW')">LW: فارغ</div>
                    <div class="player-slot" id="pos_ST" onclick="assignPlayerToSlot('ST')">ST: فارغ</div>
                    <div class="player-slot" id="pos_RW" onclick="assignPlayerToSlot('RW')">RW: فارغ</div>
                </div>

                <div class="line-row">
                    <div class="player-slot" id="pos_LM" onclick="assignPlayerToSlot('LM')">LM: فارغ</div>
                    <div class="player-slot" id="pos_CM" onclick="assignPlayerToSlot('CM')">CM: فارغ</div>
                    <div class="player-slot" id="pos_RM" onclick="assignPlayerToSlot('RM')">RM: فارغ</div>
                </div>

                <div class="line-row">
                    <div class="player-slot" id="pos_LB" onclick="assignPlayerToSlot('LB')">LB: فارغ</div>
                    <div class="player-slot" id="pos_CB1" onclick="assignPlayerToSlot('CB1')">CB: فارغ</div>
                    <div class="player-slot" id="pos_CB2" onclick="assignPlayerToSlot('CB2')">CB: فارغ</div>
                    <div class="player-slot" id="pos_RB" onclick="assignPlayerToSlot('RB')">RB: فارغ</div>
                </div>

                <div class="line-row">
                    <div class="player-slot" id="pos_GK" onclick="assignPlayerToSlot('GK')">GK: حارس</div>
                </div>
            </div>

            <div class="bench-container">
                <div class="bench-title">🎽 قائمة لاعبي النادي (المتجر)</div>
                <div id="benchList" class="bench-list">
                    </div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <button onclick="autoFillSquad()" style="background: var(--gold); border:none; padding:6px 15px; border-radius:15px; font-weight:bold; cursor:pointer;">ترتيب تلقائي للتشكيلة ⚡</button>
        </div>
    </div>

    <script>
        let myPlayers = JSON.parse(localStorage.getItem('myTeamPlayers')) || [];
        let currentSelectedSlot = null;

        renderBench();
        loadSavedLineup();

        function renderBench() {
            let benchHTML = '';
            if (myPlayers.length === 0) {
                benchHTML = '<div style="text-align:center; color:rgba(255,255,255,0.5); margin-top:100px;">لا يوجد لاعبون! افتح باكيدجات من المتجر أولاً.</div>';
            } else {
                myPlayers.forEach((player, index) => {
                    benchHTML += `
                        <div class="bench-player-card">
                            <div><strong>${player.name}</strong><br><span style="color:var(--gold);">(${player.rating})</span></div>
                            <button class="select-btn" onclick="selectPlayerForField(${index})">اختر</button>
                        </div>
                    `;
                });
            }
            document.getElementById('benchList').innerHTML = benchHTML;
        }

        function assignPlayerToSlot(slotId) {
            currentSelectedSlot = slotId;
            alert("اختر لاعباً من القائمة الجانبية لوضعه في مركز: " + slotId);
        }

        function selectPlayerForField(playerIndex) {
            if (!currentSelectedSlot) {
                alert("الرجاء الضغط على مركز في الملعب أولاً (مثل الهجوم أو الوسط)!");
                return;
            }

            let player = myPlayers[playerIndex];
            document.getElementById('pos_' + currentSelectedSlot).innerText = `${currentSelectedSlot}: ${player.name} (${player.rating})`;
            
            // حفظ التشكيلة في الذاكرة
            let lineup = JSON.parse(localStorage.getItem('teamLineup')) || {};
            lineup[currentSelectedSlot] = player;
            localStorage.setItem('teamLineup', JSON.stringify(lineup));

            currentSelectedSlot = null;
            updateOverallRating();
        }

        function loadSavedLineup() {
            let lineup = JSON.parse(localStorage.getItem('teamLineup')) || {};
            for (let slot in lineup) {
                let element = document.getElementById('pos_' + slot);
                if (element) {
                    element.innerText = `${slot}: ${lineup[slot].name} (${lineup[slot].rating})`;
                }
            }
            updateOverallRating();
        }

        function autoFillSquad() {
            if (myPlayers.length === 0) {
                alert("ليس لديك لاعبون في النادي!");
                return;
            }
            let slots = ['LW', 'ST', 'RW', 'LM', 'CM', 'RM', 'LB', 'CB1', 'CB2', 'RB', 'GK'];
            let lineup = {};
            slots.forEach((slot, index) => {
                if (myPlayers[index]) {
                    lineup[slot] = myPlayers[index];
                    document.getElementById('pos_' + slot).innerText = `${slot}: ${myPlayers[index].name} (${myPlayers[index].rating})`;
                }
            });
            localStorage.setItem('teamLineup', JSON.stringify(lineup));
            updateOverallRating();
            alert("تم ترتيب التشكيلة تلقائياً بأفضل الأساطير المتاحة!");
        }

        function updateOverallRating() {
            let lineup = JSON.parse(localStorage.getItem('teamLineup')) || {};
            let values = Object.values(lineup);
            if (values.length === 0) {
                document.getElementById('teamOverall').innerText = "تقييم الفريق: 70";
                return;
            }
            let total = values.reduce((sum, p) => sum + p.rating, 0);
            let avg = Math.round(total / values.length);
            document.getElementById('teamOverall').innerText = "تقييم الفريق: " + avg;
        }
    </script>

</body>
</html>
