<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Advanced Squad & Formations Hub</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px 30px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 8px 20px; border-radius: 15px;
        }

        .match-title { font-size: 15px; font-weight: 900; color: var(--gold); }

        .coins-container {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold);
            padding: 4px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 15px;
        }

        .squad-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 410px;
        }

        .card-box {
            background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 18px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;
        }

        .section-heading { font-size: 14px; font-weight: bold; color: var(--cyan); margin-bottom: 8px; text-align: center; }

        .players-wrapper { overflow-y: auto; height: 320px; display: flex; flex-direction: column; gap: 8px; }
        .players-wrapper::-webkit-scrollbar { width: 5px; }
        .players-wrapper::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; }

        .player-row {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            color: var(--text-main); font-size: 13px;
        }

        .player-info { display: flex; gap: 10px; align-items: center; }
        .player-rating { color: var(--gold); font-weight: bold; }
        .player-pos { color: var(--accent); font-size: 11px; background: rgba(0,255,136,0.1); padding: 2px 6px; border-radius: 6px; }

        .action-btns { display: flex; gap: 5px; }
        .sell-btn {
            background: rgba(255, 0, 127, 0.2); border: 1px solid var(--pink); color: var(--pink);
            padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s;
        }
        .sell-btn:hover { background: var(--pink); color: #fff; }

        .controls-panel { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }

        .formation-select {
            background: rgba(0,0,0,0.6); border: 2px solid var(--cyan); color: var(--text-main);
            padding: 8px; border-radius: 12px; font-weight: bold; font-size: 13px; width: 100%; text-align: center; cursor: pointer;
        }

        .play-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none; color: #020408; padding: 10px 15px; border-radius: 25px;
            font-weight: 900; font-size: 13px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 15px var(--accent-glow); width: 100%; text-align: center;
        }
        .play-btn:hover { transform: scale(1.03); }

        .back-btn {
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
            padding: 5px 15px; border-radius: 30px; cursor: pointer; font-size: 12px; font-weight: bold; text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div class="match-title">🛡️ إدارة التشكيلة والخطط وبيع النجوم</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="squad-container">
            <div class="card-box">
                <div class="section-heading">👥 لاعبو ناديك المشتراة (قادر على بيعهم)</div>
                <div class="players-wrapper" id="playersListContainer"></div>
            </div>

            <div class="card-box controls-panel">
                <div>
                    <div class="section-heading">⚙️ اختيار خطة اللعب (5 خطط عالمية)</div>
                    <select id="formationSelect" class="formation-select" onchange="saveFormation()">
                        <option value="4-3-3">خطة 4-3-3 (هجومية متوازنة)</option>
                        <option value="4-4-2">خطة 4-4-2 (الكلاسيكية الصلبة)</option>
                        <option value="4-2-3-1">خطة 4-2-3-1 (سيطرة الوسط)</option>
                        <option value="3-4-3">خطة 3-4-3 (هجوم ضاغظ مكثف)</option>
                        <option value="5-3-2">خطة 5-3-2 (دفاع حديدي ومارتدات)</option>
                    </select>
                </div>

                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                    <div style="font-size: 12px; color: var(--gold); font-weight: bold; margin-bottom: 5px;">⚡ التشكيلة الذكية المعينة:</div>
                    <div id="activeSquadView" style="font-size: 11px; color: var(--text-main); line-height: 1.4; min-height: 40px;">لم يتم تفعيل التشكيلة بعد.</div>
                </div>

                <div>
                    <button class="play-btn" onclick="autoOptimizeSquad()">تعديل التشكيلة تلقائياً بأعلى تقييم ⭐</button>
                    <div id="statusMsg" style="font-size: 11px; color: var(--accent); text-align: center; margin-top: 5px; min-height: 18px;"></div>
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="store.html" class="back-btn" style="border-color:var(--gold); color:var(--gold);">← الذهاب للمتجر لشراء لاعبين</a>
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
        </div>
    </div>

    <script>
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        let squadPlayers = JSON.parse(localStorage.getItem('purchasedPlayers')) || [];
        let savedFormation = localStorage.getItem('userFormation') || '4-3-3';
        document.getElementById('formationSelect').value = savedFormation;

        renderSquad();
        displayActiveSquad();

        function renderSquad() {
            let container = document.getElementById('playersListContainer');
            container.innerHTML = '';

            if (squadPlayers.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#888; padding:50px; font-size:12px;">ليس لديك لاعبون في النادي حالياً!<br>توجه إلى المتجر لشراء نجوم جدد.</div>`;
                return;
            }

            squadPlayers.forEach((p, index) => {
                container.innerHTML += `
                    <div class="player-row">
                        <div class="player-info">
                            <span class="player-pos">${p.pos}</span>
                            <span style="font-weight:bold;">${p.name}</span>
                            <span class="player-rating">⭐ ${p.rating}</span>
                        </div>
                        <div class="action-btns">
                            <span style="font-size:11px; color:var(--gold); margin-left:5px;">🪙 ${p.price}</span>
                            <button class="sell-btn" onclick="sellPlayer(${index})">بيع</button>
                        </div>
                    </div>
                `;
            });
            localStorage.setItem('purchasedPlayers', JSON.stringify(squadPlayers));
        }

        function sellPlayer(index) {
            let soldPlayer = squadPlayers[index];
            coins += soldPlayer.price; // استرداد نفس القيمة كاملة
            document.getElementById('playerCoins').innerText = coins;
            localStorage.setItem('userCoins', coins);

            squadPlayers.splice(index, 1);
            renderSquad();
            autoOptimizeSquad(); // إعادة تحديث التشكيلة بعد البيع

            document.getElementById('statusMsg').innerText = `تم بيع ${soldPlayer.name} واسترداد ${soldPlayer.price} عملة بالتمام والكمال!`;
        }

        function saveFormation() {
            let form = document.getElementById('formationSelect').value;
            localStorage.setItem('userFormation', form);
            autoOptimizeSquad();
        }

        function autoOptimizeSquad() {
            if (squadPlayers.length === 0) {
                document.getElementById('activeSquadView').innerText = "فريقك فارغ تماماً.";
                document.getElementById('statusMsg').innerText = "اشتر لاعبين من المتجر أولاً!";
                return;
            }

            // منع تكرار الأسماء تماماً واختيار أعلى اللاعبين تقييماً
            let usedNames = new Set();
            let uniquePlayers = [];
            let sorted = [...squadPlayers].sort((a, b) => b.rating - a.rating);

            for (let p of sorted) {
                if (!usedNames.has(p.name)) {
                    usedNames.add(p.name);
                    uniquePlayers.push(p);
                }
            }

            let formation = document.getElementById('formationSelect').value;
            let countNeeded = 11;
            if (formation === '4-4-2') countNeeded = 11;
            else if (formation === '4-3-3') countNeeded = 11;
            else if (formation === '4-2-3-1') countNeeded = 11;
            else if (formation === '3-4-3') countNeeded = 11;
            else if (formation === '5-3-2') countNeeded = 11;

            let finalSquad = uniquePlayers.slice(0, countNeeded);
            localStorage.setItem('optimizedSquad', JSON.stringify(finalSquad));

            let namesList = finalSquad.map(p => `${p.name} (${p.pos} - ⭐${p.rating})`).join(', ');
            document.getElementById('activeSquadView').innerText = namesList || "لا توجد عناصر كافية.";
            document.getElementById('statusMsg').innerText = `تم تطبيق خطة (${formation}) واختيار أعلى اللاعبين بدون تكرار!`;
        }

        function displayActiveSquad() {
            let currentOptimized = JSON.parse(localStorage.getItem('optimizedSquad')) || [];
            if (currentOptimized.length > 0) {
                let namesList = currentOptimized.map(p => `${p.name} (${p.pos} - ⭐${p.rating})`).join(', ');
                document.getElementById('activeSquadView').innerText = namesList;
            }
        }
    </script>

</body>
</html>
