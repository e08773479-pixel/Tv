<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Ultimate Pro Career & European Qualifications</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px 30px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 8px 20px; border-radius: 15px;
        }

        .match-title { font-size: 13px; font-weight: 900; color: var(--gold); }

        .coins-container {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold);
            padding: 4px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 14px;
        }

        .league-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 410px;
        }

        .card-box {
            background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 18px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;
        }

        .section-heading { font-size: 13px; font-weight: bold; color: var(--cyan); margin-bottom: 8px; text-align: center; }

        .table-wrapper { overflow-y: auto; height: 280px; }
        .table-wrapper::-webkit-scrollbar { width: 5px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; color: var(--text-main); text-align: center; }
        th, td { padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: var(--gold); background: rgba(0,0,0,0.6); }

        .match-center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }

        .vs-display {
            font-size: 14px; font-weight: bold; color: var(--text-main);
            background: rgba(0,0,0,0.5); border: 2px solid var(--pink);
            padding: 10px; border-radius: 15px; width: 100%;
        }

        .match-result-text { font-size: 11px; color: var(--accent); min-height: 25px; line-height: 1.4; }

        .play-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none; color: #020408; padding: 10px 20px; border-radius: 25px;
            font-weight: 900; font-size: 13px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 15px var(--accent-glow); width: 100%; text-align: center;
        }
        .play-btn:hover { transform: scale(1.03); }

        .back-btn {
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
            padding: 5px 15px; border-radius: 30px; cursor: pointer; font-size: 12px; font-weight: bold; text-decoration: none;
        }

        .mode-nav { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
        .mode-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--cyan); color: #fff; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }

        /* رسالة الاحتفال المخصصة الأنيقة */
        #customModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.85); display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content {
            background: linear-gradient(135deg, #0d1b2a, #050b14); border: 3px solid var(--gold);
            padding: 30px; border-radius: 22px; text-align: center; width: 420px;
            box-shadow: 0 0 50px var(--gold-glow); color: #fff;
        }
    </style>
</head>
<body>

    <div id="customModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: var(--gold); margin-top:0;">🏆 إنجاز تاريخي!</h2>
            <p id="modalDesc" style="font-size: 13px; line-height: 1.6; color: #ddd; margin: 15px 0;">مبروك يا أسطورة...</p>
            <button class="play-btn" onclick="closeModal()" style="width:auto; padding: 8px 25px;">استمرار الاحتفال 🚀</button>
        </div>
    </div>

    <div class="game-viewport">
        <div class="top-bar">
            <div id="tournamentTitle" class="match-title">🏆 دوري الـ 38 جولة والبطولات الأوروبية</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="league-container">
            <div class="card-box" id="leftCardBox">
                <div id="tableHeading" class="section-heading">📊 جدول الترتيب والنقاط</div>
                <div class="table-wrapper" id="tableWrapperContainer">
                    <table>
                        <thead>
                            <tr>
                                <th>النادي</th>
                                <th>لعب</th>
                                <th>نقاط</th>
                            </tr>
                        </thead>
                        <tbody id="standingsTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card-box match-center-box">
                <div id="roundIndicator" class="section-heading">الجولة: 1 / 38</div>
                
                <div class="vs-display">
                    <div id="teamHome">ناديك</div>
                    <div style="font-size: 10px; color: var(--gold); margin: 2px 0;">VS (حسب قوة تشكيلتك ⭐)</div>
                    <div id="teamAway" style="color: var(--pink);">جاري تحديد الخصم...</div>
                </div>

                <div id="matchOutcome" class="match-result-text">نظام 38 جولة ذهاب وعودة، وتأهل دقيق لدوري الأبطال أو الدوري الأوروبي! ⚡</div>

                <button class="play-btn" onclick="startLiveMatch()">دخول الماتش الحي وتحديث النتائج 🏟️</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <div class="mode-nav">
                <button class="mode-btn" onclick="switchMode('league')">الدوري (38 جولة)</button>
                <button class="mode-btn" onclick="switchMode('ucl')" style="border-color:var(--gold); color:var(--gold);">دوري الأبطال</button>
                <button class="mode-btn" onclick="switchMode('europa')" style="border-color:var(--cyan); color:var(--cyan);">الدوري الأوروبي</button>
            </div>
        </div>
    </div>

    <script>
        let userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        let currentMode = localStorage.getItem('careerMode') || 'league';
        let leagueRound = parseInt(localStorage.getItem('leagueRound')) || 1;
        let uclRound = parseInt(localStorage.getItem('uclRound')) || 1;
        let europaRound = parseInt(localStorage.getItem('europaRound')) || 1;
        let uclPhase = localStorage.getItem('uclPhase') || 'league'; // 'league', 'r16', 'qf', 'sf', 'final'

        let premier20 = JSON.parse(localStorage.getItem('premierLeague20')) || [
            { name: userTeam, played: 0, pts: 0 }, { name: "أرسنال", played: 0, pts: 0 },
            { name: "مانشستر سيتي", played: 0, pts: 0 }, { name: "ليفربول", played: 0, pts: 0 },
            { name: "تشيلسي", played: 0, pts: 0 }, { name: "توتنهام", played: 0, pts: 0 },
            { name: "مانشستر يونايتد", played: 0, pts: 0 }, { name: "نيوكاسل يونايتد", played: 0, pts: 0 },
            { name: "أستون فيلا", played: 0, pts: 0 }, { name: "برايتون", played: 0, pts: 0 },
            { name: "وست هام يونايتد", played: 0, pts: 0 }, { name: "كريستال بالاس", played: 0, pts: 0 },
            { name: "فولهام", played: 0, pts: 0 }, { name: "برينتفورد", played: 0, pts: 0 },
            { name: "وولفرهامبتون", played: 0, pts: 0 }, { name: "إيفرتون", played: 0, pts: 0 },
            { name: "نوتنغهام فورست", played: 0, pts: 0 }, { name: "بورنموث", played: 0, pts: 0 },
            { name: "ليستر سيتي", played: 0, pts: 0 }, { name: "إيبسويتش تاون", played: 0, pts: 0 }
        ];

        let ucl32 = JSON.parse(localStorage.getItem('uclLeague32')) || [
            { name: userTeam, played: 0, pts: 0 }, { name: "ريال مدريد", played: 0, pts: 0 },
            { name: "برشلونة", played: 0, pts: 0 }, { name: "أتلتيكو مدريد", played: 0, pts: 0 },
            { name: "جيرونا", played: 0, pts: 0 }, { name: "مانشستر سيتي", played: 0, pts: 0 },
            { name: "أرسنال", played: 0, pts: 0 }, { name: "ليفربول", played: 0, pts: 0 },
            { name: "أستون فيلا", played: 0, pts: 0 }, { name: "بايرن ميونخ", played: 0, pts: 0 },
            { name: "بوروسيا دورتموند", played: 0, pts: 0 }, { name: "باير ليفركوزن", played: 0, pts: 0 },
            { name: "لايبزيغ", played: 0, pts: 0 }, { name: "شتوتغارت", played: 0, pts: 0 },
            { name: "إنتر ميلان", played: 0, pts: 0 }, { name: "إيه سي ميلان", played: 0, pts: 0 },
            { name: "يوفنتوس", played: 0, pts: 0 }, { name: "أتلانتا", played: 0, pts: 0 },
            { name: "بولونيا", played: 0, pts: 0 }, { name: "باريس سان جيرمان", played: 0, pts: 0 },
            { name: "موناكو", played: 0, pts: 0 }, { name: "بريست", played: 0, pts: 0 },
            { name: "ليل", played: 0, pts: 0 }, { name: "سبورتنج لشبونة", played: 0, pts: 0 },
            { name: "بنفيكا", played: 0, pts: 0 }, { name: "بورتو", played: 0, pts: 0 },
            { name: "أياكس أمستردام", played: 0, pts: 0 }, { name: "آيندهوفن", played: 0, pts: 0 },
            { name: "سلتيك", played: 0, pts: 0 }, { name: "شاختار دونيتسك", played: 0, pts: 0 },
            { name: "غلطة سراي", played: 0, pts: 0 }, { name: "ريد بول سالزبورغ", played: 0, pts: 0 }
        ];

        let europaTeams = JSON.parse(localStorage.getItem('europaTeamsList')) || [
            { name: userTeam, played: 0, pts: 0 }, { name: "روما", played: 0, pts: 0 },
            { name: "لاتسيو", played: 0, pts: 0 }, { name: "توتنهام", played: 0, pts: 0 },
            { name: "مانشستر يونايتد", played: 0, pts: 0 }, { name: "بورتو", played: 0, pts: 0 },
            { name: "ريال سوسيداد", played: 0, pts: 0 }, { name: "أتلتيك بلباو", played: 0, pts: 0 }
        ];

        renderUI();

        function switchMode(mode) {
            currentMode = mode;
            localStorage.setItem('careerMode', mode);
            renderUI();
        }

        function renderUI() {
            let tbody = document.getElementById('standingsTableBody');
            tbody.innerHTML = '';

            let activeList, title;
            if (currentMode === 'league') {
                activeList = premier20;
                title = `📊 جدول الدوري المحلي (38 جولة) - جولة ${leagueRound}/38`;
                document.getElementById('tournamentTitle').innerText = "🏆 البريميرليج (38 جولة كاملة)";
                document.getElementById('roundIndicator').innerText = `الجولة: ${leagueRound} / 38`;
            } else if (currentMode === 'ucl') {
                activeList = ucl32;
                if (uclPhase === 'league') {
                    title = `⭐ دوري الأبطال (32 فريق) - جولة ${uclRound}/31`;
                    document.getElementById('tournamentTitle').innerText = "⭐ مرحلة الدوري للأبطال (تأهل أول 16 للإقصاء)";
                    document.getElementById('roundIndicator').innerText = `جولة الأبطال: ${uclRound} / 31`;
                } else {
                    // إخفاء الجدول وإظهار مرحلة الإقصاء (ذهاب وعودة)
                    showKnockoutUI(uclPhase, 'دوري أبطال أوروبا');
                    return;
                }
            } else {
                activeList = europaTeams;
                title = `🛡️ الدوري الأوروبي (للمراكز 5 إلى 8) - جولة ${europaRound}/10`;
                document.getElementById('tournamentTitle').innerText = "🛡️ الدوري الأوروبي (إقصائيات مخصصة)";
                document.getElementById('roundIndicator').innerText = `الدوري الأوروبي: ${europaRound} / 10`;
            }

            document.getElementById('tableHeading').innerText = title;
            document.getElementById('tableWrapperContainer').style.display = 'block';

            activeList.sort((a, b) => b.pts - a.pts);
            activeList.forEach((t, i) => {
                let isUser = t.name === userTeam ? "color: var(--accent); font-weight:900;" : "";
                let tag = "";
                if (currentMode === 'league') {
                    if (i < 4) tag = " ⭐ [دوري الأبطال]";
                    else if (i >= 4 && i < 8) tag = " 🛡️ [دوري أوروبي]";
                } else if (currentMode === 'ucl' && i < 16) {
                    tag = " ⭐ [متأهل للإقصائيات]";
                }
                tbody.innerHTML += `<tr style="${isUser}"><td>${i + 1}. ${t.name}${tag}</td><td>${t.played}</td><td>${t.pts}</td></tr>`;
            });

            let opponents = activeList.filter(t => t.name !== userTeam);
            let chosenOpp = opponents[Math.floor(Math.random() * opponents.length)] || { name: "الخصم القادم" };
            document.getElementById('teamHome').innerText = userTeam;
            document.getElementById('teamAway').innerText = chosenOpp.name;
            localStorage.setItem('currentOpponent', chosenOpp.name);
        }

        function showKnockoutUI(phase, tournamentName) {
            let phaseNames = {
                'r16': 'دور الـ 16 (ذهاب وعودة 🔄)',
                'qf': 'ربع النهائي (ذهاب وعودة 🔄)',
                'sf': 'نصف النهائي (ذهاب وعودة 🔄)',
                'final': 'المباراة النهائية الكبرى 🏆'
            };

            document.getElementById('tableHeading').innerText = `🔥 ${tournamentName} - ${phaseNames[phase]}`;
            document.getElementById('tableWrapperContainer').style.display = 'none'; // إخفاء الجدول التقليدي
            
            let knockoutBox = document.getElementById('tableWrapperContainer');
            // استبدال محتوى جدول الترتيب بصرياً بنظام الإقصاء
            document.getElementById('leftCardBox').querySelector('.table-wrapper').innerHTML = `
                <div style="padding: 20px; text-align: center; color: var(--gold); font-size: 13px; line-height: 1.8;">
                    🔥 تم تأهلك لمرحلة خروج المغلوب بنظام الذهاب والعودة!<br>
                    <span style="color:var(--cyan); font-weight:bold;">المرحلة الحالية: ${phaseNames[phase]}</span><br>
                    <span style="font-size:11px; color:#aaa;">كل فوز يقربك خطوة نحو رفع الكأس الأسطوري وإضافته لخزائن ناديك!</span>
                </div>
            `;

            document.getElementById('roundIndicator').innerText = `مرحلة الإقصائيات (ذهاب/عودة)`;
            document.getElementById('teamHome').innerText = userTeam;
            document.getElementById('teamAway').innerText = phase === 'final' ? "عملاق النهائي الأوروبي" : "خصم الإقصائيات الشرس";
            localStorage.setItem('currentOpponent', document.getElementById('teamAway').innerText);
        }

        function startLiveMatch() {
            let optimizedSquad = JSON.parse(localStorage.getItem('optimizedSquad')) || [];
            let squadRating = 92;
            if (optimizedSquad.length > 0) {
                let total = optimizedSquad.reduce((sum, p) => sum + (p.rating || 90), 0);
                squadRating = Math.round(total / optimizedSquad.length);
            }

            localStorage.setItem('userSquadPower', squadRating);
            window.location.href = 'live_match.html';
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerHTML = desc;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }
    </script>

</body>
</html>
