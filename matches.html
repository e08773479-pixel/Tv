<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Ultimate Career & Match Engine</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }
        
        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px 30px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 8px 20px; border-radius: 15px;
        }

        .match-title { font-size: 15px; font-weight: 900; color: var(--gold); }

        .coins-container {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold);
            padding: 4px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 15px;
        }

        .league-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 410px;
        }

        .card-box {
            background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 18px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;
        }

        .section-heading { font-size: 14px; font-weight: bold; color: var(--cyan); margin-bottom: 8px; text-align: center; }

        .table-wrapper { overflow-y: auto; height: 300px; }
        .table-wrapper::-webkit-scrollbar { width: 5px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; color: var(--text-main); text-align: center; }
        th, td { padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: var(--gold); background: rgba(0,0,0,0.6); }

        .match-center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }

        .vs-display {
            font-size: 16px; font-weight: bold; color: var(--text-main);
            background: rgba(0,0,0,0.5); border: 2px solid var(--pink);
            padding: 10px; border-radius: 15px; width: 100%;
        }

        .match-result-text { font-size: 12px; color: var(--accent); min-height: 30px; }

        .play-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none; color: #020408; padding: 10px 20px; border-radius: 25px;
            font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 15px var(--accent-glow); width: 100%;
        }
        .play-btn:hover { transform: scale(1.03); }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 15px; z-index: 20; display: none;
        }

        .trophy-card {
            background: linear-gradient(135deg, #111, #222); border: 3px solid var(--gold);
            border-radius: 20px; padding: 25px; width: 400px; text-align: center;
            box-shadow: 0 0 50px var(--gold-glow); color: var(--text-main);
        }

        .back-btn {
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
            padding: 5px 15px; border-radius: 30px; cursor: pointer; font-size: 12px; font-weight: bold; text-decoration: none;
        }

        .mode-nav { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
        .mode-nav button { border: none; padding: 5px 8px; border-radius: 10px; font-weight: bold; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div id="activeTournamentTitle" class="match-title">🏆 إدارة البطولات</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="league-container">
            <div class="card-box">
                <div id="tableHeading" class="section-heading">📊 جدول الترتيب</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>النادي</th>
                                <th>لعب</th>
                                <th>نقاط</th>
                            </tr>
                        </thead>
                        <tbody id="standingsTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card-box match-center-box">
                <div id="roundIndicator" class="section-heading">الجولة: 1</div>
                
                <div class="vs-display">
                    <div id="teamHome">ناديك</div>
                    <div style="font-size: 11px; color: var(--gold); margin: 2px 0;">VS</div>
                    <div id="teamAway" style="color: var(--pink);">جاري التحميل...</div>
                </div>

                <div id="matchOutcome" class="match-result-text">جاهز لدخول المعركة 🚀</div>

                <button id="actionBtn" class="play-btn" onclick="goToLiveMatch()">دخول الماتش الحي 🏟️</button>
            </div>
        </div>

        <div id="seasonModal" class="modal-overlay">
            <div class="trophy-card">
                <div style="font-size: 40px;" id="trophyIcon">🏆</div>
                <h2 id="seasonResultTitle" style="color: var(--gold); margin: 10px 0; font-size: 18px;">نهاية المرحلة!</h2>
                <p id="seasonResultDesc" style="font-size: 12px; line-height: 1.5;"></p>
                <button class="play-btn" id="modalNextBtn" style="margin-top: 15px;" onclick="proceedNextStage()">متابعة ⭐</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <div class="mode-nav">
                <button onclick="switchMode('league')" id="btnLeague">الدوري</button>
                <button onclick="switchMode('ucl')" id="btnUcl" style="display:none;">دوري الأبطال</button>
                <button onclick="switchMode('uel')" id="btnUel" style="display:none;">الدوري الأوروبي</button>
                <button onclick="switchMode('super')" id="btnSuper" style="display:none;">كأس السوبر</button>
            </div>
        </div>
    </div>

    <script>
        const userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        let currentMode = localStorage.getItem('careerMode') || 'league'; 
        let leagueRound = parseInt(localStorage.getItem('leagueRound')) || 1;
        let uclRound = parseInt(localStorage.getItem('uclRound')) || 1;
        let uelRound = parseInt(localStorage.getItem('uelRound')) || 1;

        // إظهار الأزرار بناءً على التقدم
        if(localStorage.getItem('unlockedUCL') === 'true') document.getElementById('btnUcl').style.display = 'block';
        if(localStorage.getItem('unlockedUEL') === 'true') document.getElementById('btnUel').style.display = 'block';
        if(localStorage.getItem('unlockedSuper') === 'true') document.getElementById('btnSuper').style.display = 'block';

        // بيانات الجداول الأساسية
        let premierTeams = JSON.parse(localStorage.getItem('leagueStandings')) || [
            { name: userTeam, played: 0, pts: 0 }, { name: "أرسنال", played: 0, pts: 0 },
            { name: "مانشستر سيتي", played: 0, pts: 0 }, { name: "ليفربول", played: 0, pts: 0 },
            { name: "تشيلسي", played: 0, pts: 0 }, { name: "أستون فيلا", played: 0, pts: 0 },
            { name: "توتنهام", played: 0, pts: 0 }, { name: "نيوكاسل", played: 0, pts: 0 },
            { name: "مانشستر يونايتد", played: 0, pts: 0 }, { name: "وست هام", played: 0, pts: 0 },
            { name: "كريستال بالاس", played: 0, pts: 0 }, { name: "برايتون", played: 0, pts: 0 },
            { name: "بورنموث", played: 0, pts: 0 }, { name: "فولهام", played: 0, pts: 0 },
            { name: "وولفرهامبتون", played: 0, pts: 0 }, { name: "إيفرتون", played: 0, pts: 0 },
            { name: "برينتفورد", played: 0, pts: 0 }, { name: "نوتنغهام", played: 0, pts: 0 },
            { name: "ليستر سيتي", played: 0, pts: 0 }, { name: "إبسويتش", played: 0, pts: 0 }
        ];

        let uclTeams = JSON.parse(localStorage.getItem('uclStandings')) || [
            { name: userTeam, played: 0, pts: 0 }, { name: "ريال مدريد", played: 0, pts: 0 },
            { name: "برشلونة", played: 0, pts: 0 }, { name: "بايرن ميونخ", played: 0, pts: 0 },
            { name: "باريس سان جيرمان", played: 0, pts: 0 }, { name: "يوفنتوس", played: 0, pts: 0 },
            { name: "بوروسيا دورتموند", played: 0, pts: 0 }, { name: "إنتر ميلان", played: 0, pts: 0 }
        ];

        let uelTeams = JSON.parse(localStorage.getItem('uelStandings')) || [
            { name: userTeam, played: 0, pts: 0 }, { name: "روما", played: 0, pts: 0 },
            { name: "إشبيلية", played: 0, pts: 0 }, { name: "فياريال", played: 0, pts: 0 },
            { name: "باير ليفركوزن", played: 0, pts: 0 }, { name: "أياكس", played: 0, pts: 0 },
            { name: "مارسيليا", played: 0, pts: 0 }, { name: "بورتو", played: 0, pts: 0 }
        ];

        // حفظهم إجباري لضمان عدم ظهور الشاشة السوداء
        localStorage.setItem('leagueStandings', JSON.stringify(premierTeams));
        localStorage.setItem('uclStandings', JSON.stringify(uclTeams));
        localStorage.setItem('uelStandings', JSON.stringify(uelTeams));

        updateUI();

        function switchMode(mode) {
            currentMode = mode;
            localStorage.setItem('careerMode', mode);
            updateUI();
        }

        function goToLiveMatch() {
            if (currentMode === 'super') {
                localStorage.setItem('currentOpponent', 'بطل القارة المنافس');
                window.location.href = 'live_match.html';
                return;
            }

            let activeList = currentMode === 'league' ? premierTeams : (currentMode === 'ucl' ? uclTeams : uelTeams);
            let opponents = activeList.filter(t => t.name !== userTeam);
            let chosenOpp = opponents[Math.floor(Math.random() * opponents.length)];
            
            localStorage.setItem('currentOpponent', chosenOpp.name);
            window.location.href = 'live_match.html';
        }

        function updateUI() {
            let tbody = document.getElementById('standingsTableBody');
            tbody.innerHTML = '';

            ['league', 'ucl', 'uel', 'super'].forEach(m => {
                let btn = document.getElementById('btn' + m.charAt(0).toUpperCase() + m.slice(1));
                if(btn) {
                    btn.style.background = currentMode === m ? 'var(--accent)' : (m === 'super' ? 'rgba(255,215,0,0.3)' : 'rgba(255,255,255,0.2)');
                    btn.style.color = currentMode === m ? '#020408' : (m === 'super' ? 'var(--gold)' : '#fff');
                }
            });

            if (currentMode === 'super') {
                document.getElementById('activeTournamentTitle').innerText = `✨ نهائي كأس السوبر الأوروبي`;
                document.getElementById('roundIndicator').innerText = `المباراة النهائية الكبرى`;
                document.getElementById('tableHeading').innerText = "🏆 نهائي السوبر";
                tbody.innerHTML = `<tr><td colspan="3" style="padding:40px; color:var(--gold); font-weight:bold;">مواجهة حاسمة لتتويج بطل السوبر!</td></tr>`;
                document.getElementById('teamHome').innerText = userTeam;
                document.getElementById('teamAway').innerText = "بطل الكأس المنافس";
                return;
            }

            let activeList, titleText, roundText, headingText;

            if (currentMode === 'league') {
                if (leagueRound > 38) { checkLeagueEnd(); return; }
                activeList = premierTeams;
                titleText = `🏆 الدوري الإنجليزي`;
                roundText = `الجولة: ${leagueRound} / 38`;
                headingText = "📊 جدول ترتيب البريميرليج";
            } else if (currentMode === 'ucl') {
                if (uclRound > 6) { checkUCLEnd(); return; }
                activeList = uclTeams;
                titleText = `⭐ دوري أبطال أوروبا`;
                roundText = `الجولة الأوروبية: ${uclRound} / 6`;
                headingText = "📊 جدول مجموعة دوري الأبطال";
            } else {
                if (uelRound > 6) { checkUELEnd(); return; }
                activeList = uelTeams;
                titleText = `🛡️ الدوري الأوروبي`;
                roundText = `الجولة الأوروبية: ${uelRound} / 6`;
                headingText = "📊 جدول مجموعة الدوري الأوروبي";
            }

            document.getElementById('activeTournamentTitle').innerText = titleText;
            document.getElementById('roundIndicator').innerText = roundText;
            document.getElementById('tableHeading').innerText = headingText;

            activeList.sort((a, b) => b.pts - a.pts);
            activeList.forEach((team, index) => {
                let isUser = team.name === userTeam ? "color: var(--accent); font-weight:900;" : "";
                tbody.innerHTML += `<tr style="${isUser}"><td>${index + 1}. ${team.name}</td><td>${team.played}</td><td>${team.pts}</td></tr>`;
            });

            let opponents = activeList.filter(t => t.name !== userTeam);
            let chosenOpp = opponents[Math.floor(Math.random() * opponents.length)];
            document.getElementById('teamHome').innerText = userTeam;
            document.getElementById('teamAway').innerText = chosenOpp.name;
            localStorage.setItem('currentOpponent', chosenOpp.name);
        }

        function checkLeagueEnd() {
            premierTeams.sort((a, b) => b.pts - a.pts);
            let userRank = premierTeams.findIndex(t => t.name === userTeam) + 1;
            
            let title = "", desc = "";
            if (userRank >= 1 && userRank <= 4) {
                title = `🏆 مبروك! المركز ${userRank} في الدوري`;
                desc = `تأهلت رسمياً إلى "دوري أبطال أوروبا"! حصلت على 5000 عملة.`;
                coins += 5000;
                localStorage.setItem('unlockedUCL', 'true');
                document.getElementById('btnUcl').style.display = 'block';
            } else if (userRank >= 5 && userRank <= 8) {
                title = `🛡️ المركز ${userRank} في الدوري`;
                desc = `تأهلت رسمياً إلى منافسات "الدوري الأوروبي"! حصلت على 3000 عملة.`;
                coins += 3000;
                localStorage.setItem('unlockedUEL', 'true');
                document.getElementById('btnUel').style.display = 'block';
            } else {
                title = `أنهيت الدوري في المركز ${userRank}`;
                desc = `لم تتأهل للبطولات الأوروبية.`;
            }

            localStorage.setItem('userCoins', coins);
            document.getElementById('seasonResultTitle').innerText = title;
            document.getElementById('seasonResultDesc').innerText = desc;
            document.getElementById('seasonModal').style.display = 'flex';
        }

        function checkUCLEnd() {
            uclTeams.sort((a, b) => b.pts - a.pts);
            let rank = uclTeams.findIndex(t => t.name === userTeam) + 1;
            let title = rank === 1 ? "⭐ بطل دوري أبطال أوروبا! ⭐" : `نهاية دوري الأبطال (المركز ${rank})`;
            let desc = rank === 1 ? "توجت باللقب الأغلى وحصلت على 8000 عملة وتأهلت لنهائي السوبر!" : "أداء أوروبي رائع.";
            if(rank === 1) {
                coins += 8000;
                localStorage.setItem('unlockedSuper', 'true');
                document.getElementById('btnSuper').style.display = 'block';
            }
            localStorage.setItem('userCoins', coins);
            document.getElementById('seasonResultTitle').innerText = title;
            document.getElementById('seasonResultDesc').innerText = desc;
            document.getElementById('seasonModal').style.display = 'flex';
        }

        function checkUELEnd() {
            uelTeams.sort((a, b) => b.pts - a.pts);
            let rank = uelTeams.findIndex(t => t.name === userTeam) + 1;
            let title = rank === 1 ? "🛡️ بطل الدوري الأوروبي!" : `نهاية الدوري الأوروبي (المركز ${rank})`;
            let desc = rank === 1 ? "توجت باللقب وحصلت على 6000 عملة وتأهلت لنهائي السوبر!" : "مشاركة ممتازة.";
            if(rank === 1) {
                coins += 6000;
                localStorage.setItem('unlockedSuper', 'true');
                document.getElementById('btnSuper').style.display = 'block';
            }
            localStorage.setItem('userCoins', coins);
            document.getElementById('seasonResultTitle').innerText = title;
            document.getElementById('seasonResultDesc').innerText = desc;
            document.getElementById('seasonModal').style.display = 'flex';
        }

        function proceedNextStage() {
            document.getElementById('seasonModal').style.display = 'none';
            if (localStorage.getItem('unlockedSuper') === 'true') {
                switchMode('super');
            } else if (localStorage.getItem('unlockedUCL') === 'true') {
                switchMode('ucl');
            } else if (localStorage.getItem('unlockedUEL') === 'true') {
                switchMode('uel');
            } else {
                localStorage.setItem('leagueRound', '1');
                location.reload();
            }
        }
    </script>

</body>
</html>
