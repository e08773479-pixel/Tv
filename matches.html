<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Match Center</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-viewport {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 35px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 10px 20px;
            border-radius: 15px;
        }

        .match-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--pink);
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
        }

        .coins-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid var(--gold);
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--gold);
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* ملعب المباراة */
        .match-arena {
            background: linear-gradient(135deg, rgba(0, 50, 20, 0.6), rgba(0, 20, 10, 0.8));
            border: 2px solid var(--accent);
            border-radius: 20px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 20px;
            box-shadow: inset 0 0 30px rgba(0, 255, 136, 0.2);
            text-align: center;
        }

        .match-scoreboard {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            font-size: 28px;
            font-weight: 900;
            color: var(--text-main);
        }

        .team-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--cyan);
            padding: 15px 25px;
            border-radius: 15px;
            min-width: 220px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .score-number {
            font-size: 45px;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .match-status {
            font-size: 18px;
            color: var(--accent);
            font-weight: bold;
            letter-spacing: 1px;
            min-height: 30px;
        }

        .play-match-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none;
            color: #020408;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .play-match-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .back-btn {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            padding: 8px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--cyan);
            color: #020408;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div class="match-title">⚽ جولة الدوري الإنجليزي الممتاز</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="match-arena">
            <div id="matchStatusText" class="match-status">استعد لدخول الميدان ومواجهة أحد أندية البريميرليج!</div>
            
            <div class="match-scoreboard">
                <div class="team-box">
                    <div id="userTeamName" style="color: var(--cyan);">ناديك</div>
                    <div id="userScore" class="score-number">0</div>
                </div>
                <div style="font-size: 25px; color: var(--gold);">VS</div>
                <div class="team-box">
                    <div id="opponentTeamName" style="color: var(--pink);">في انتظار الخصم...</div>
                    <div id="opponentScore" class="score-number">0</div>
                </div>
            </div>

            <button id="actionBtn" class="play-match-btn" onclick="playMatch()">انطلاق صافرة المباراة 🚀</button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <div style="font-size: 13px; color: rgba(255,255,255,0.5);">Joker League Pro Simulation</div>
        </div>
    </div>

    <script>
        // عرض اسم الفريق والعملات الحالية
        const selectedTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        document.getElementById('userTeamName').innerText = selectedTeam;

        // قائمة كل أندية الدوري الإنجليزي الـ 20
        const allPremierTeams = [
            "أرسنال", "أستون فيلا", "برايتون آند هوف ألبيون", "بورنموث", 
            "برينتفورد", "تشيلسي", "كريستال بالاس", "إيفرتون", 
            "فولهام", "إبسويتش تاون", "ليستر سيتي", "ليفربول", 
            "مانشستر سيتي", "مانشستر يونايتد", "نيوكاسل يونايتد", 
            "نوتنغهام فورست", "ساوثهامبتون", "توتنهام هوتسبير", 
            "وولفرهامبتون", "وست هام يونايتد"
        ];
        
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        function playMatch() {
            // اختيار خصم عشوائي (يتم استبعاد نادي المستخدم لو كان موجوداً في القائمة لعدم تكراره)
            let availableOpponents = allPremierTeams.filter(team => team !== selectedTeam);
            let randomOpponent = availableOpponents[Math.floor(Math.random() * availableOpponents.length)];
            document.getElementById('opponentTeamName').innerText = randomOpponent;

            // نظام نتائج عشوائي غير متوقع بالكامل (من 0 إلى 5 أهداف لكل فريق)
            let userGoals = Math.floor(Math.random() * 6);
            let opponentGoals = Math.floor(Math.random() * 6);

            document.getElementById('userScore').innerText = userGoals;
            document.getElementById('opponentScore').innerText = opponentGoals;

            let statusText = document.getElementById('matchStatusText');
            let btn = document.getElementById('actionBtn');

            if (userGoals > opponentGoals) {
                let reward = (userGoals - opponentGoals >= 3) ? 400 : 250;
                statusText.innerHTML = `🔥 فوز تاريخي ومذهل أمام ${randomOpponent}! كسبت <span style='color: var(--gold);'>${reward} عملة</span>!`;
                coins += reward;
            } else if (userGoals === opponentGoals) {
                statusText.innerHTML = `🤝 تعادل دراماتيكي بنتيجة (${userGoals}-${opponentGoals}) مع ${randomOpponent}! كسبت <span style='color: var(--gold);'>120 عملة</span>.`;
                coins += 120;
            } else {
                statusText.innerHTML = `💔 خسارة قاسية ومفاجئة أمام ${randomOpponent} (${userGoals}-${opponentGoals}). رتب صفوف ناديك!`;
            }

            // تحديث العملات وحفظها
            localStorage.setItem('userCoins', coins);
            document.getElementById('playerCoins').innerText = coins;

            // تغيير نص الزر للجولة القادمة
            btn.innerText = "خوض الجولة القادمة ⚽";
        }
    </script>

</body>
</html>
