<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - League Table & Matches</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-viewport {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 8px 20px;
            border-radius: 15px;
        }

        .match-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
        }

        .coins-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid var(--gold);
            padding: 4px 12px;
            border-radius: 20px;
            color: var(--gold);
            font-weight: bold;
            font-size: 16px;
        }

        /* حاوية محتوى الدوري والمباريات */
        .league-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            height: 410px;
        }

        .card-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .section-heading {
            font-size: 16px;
            font-weight: bold;
            color: var(--cyan);
            margin-bottom: 10px;
            text-align: center;
        }

        /* جدول ترتيب الدوري المصغر */
        .table-wrapper {
            overflow-y: auto;
            height: 310px;
        }
        .table-wrapper::-webkit-scrollbar { width: 5px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            color: var(--text-main);
            text-align: center;
        }

        th, td {
            padding: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th {
            color: var(--gold);
            background: rgba(0,0,0,0.6);
        }

        /* قسم خوض الجولة والقرعة */
        .match-center-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 15px;
        }

        .vs-display {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--pink);
            padding: 12px;
            border-radius: 15px;
            width: 100%;
        }

        .match-result-text {
            font-size: 14px;
            color: var(--accent);
            min-height: 45px;
        }

        .play-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none;
            color: #020408;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px var(--accent-glow);
            width: 100%;
        }

        .play-btn:hover {
            transform: scale(1.03);
        }

        .back-btn {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            padding: 6px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div class="match-title">🏆 دوري البريميرليج ونظام القرعة الشامل</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="league-container">
            <div class="card-box">
                <div class="section-heading">📊 جدول ترتيب الدوري العام</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>النادي</th>
                                <th>لعب</th>
                                <th>نقاط</th>
                            </tr>
                        </thead>
                        <tbody id="standingsTableBody">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="card-box match-center-box">
                <div class="section-heading" id="currentRoundTitle">الجولة رقم: 1</div>
                
                <div class="vs-display">
                    <div id="teamHome">ناديك</div>
                    <div style="font-size: 14px; color: var(--gold); margin: 5px 0;">VS</div>
                    <div id="teamAway" style="color: var(--pink);">خصم الجولة</div>
                </div>

                <div id="matchOutcome" class="match-result-text">اضغط على زر خوض الجولة لبدء مباريات الفرق والقرعة!</div>

                <button class="play-btn" onclick="simulateLeagueRound()">لعب جولة الدوري الحالية 🚀</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <div style="font-size: 12px; color: rgba(255,255,255,0.5);">Joker Full League Engine</div>
        </div>
    </div>

    <script>
        const userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        // قائمة كل الأندية الـ 20 وتوليد نقاط وترتيب ابتدائي لو مش موجود
        let allTeams = JSON.parse(localStorage.getItem('leagueStandings')) || [
            { name: userTeam, played: 0, pts: 0 },
            { name: "أرسنال", played: 0, pts: 0 },
            { name: "مانشستر سيتي", played: 0, pts: 0 },
            { name: "ليفربول", played: 0, pts: 0 },
            { name: "تشيلسي", played: 0, pts: 0 },
            { name: "أستون فيلا", played: 0, pts: 0 },
            { name: "توتنهام هوتسبير", played: 0, pts: 0 },
            { name: "نيوكاسل يونايتد", played: 0, pts: 0 },
            { name: "مانشستر يونايتد", played: 0, pts: 0 },
            { name: "وست هام يونايتد", played: 0, pts: 0 },
            { name: "كريستال بالاس", played: 0, pts: 0 },
            { name: "برايتون آند هوف ألبيون", played: 0, pts: 0 },
            { name: "بورنموث", played: 0, pts: 0 },
            { name: "فولهام", played: 0, pts: 0 },
            { name: "وولفرهامبتون", played: 0, pts: 0 },
            { name: "إيفرتون", played: 0, pts: 0 },
            { name: "برينتفورد", played: 0, pts: 0 },
            { name: "نوتنغهام فورست", played: 0, pts: 0 },
            { name: "ليستر سيتي", played: 0, pts: 0 },
            { name: "إبسويتش تاون", played: 0, pts: 0 },
            { name: "ساوثهامبتون", played: 0, pts: 0 }
        ];

        let currentRound = parseInt(localStorage.getItem('leagueRound')) || 1;
        document.getElementById('currentRoundTitle').innerText = "الجولة رقم: " + currentRound;

        updateTableUI();

        function simulateLeagueRound() {
            // اختيار خصم عشوائي لنادي المستخدم من القرعة
            let opponentsList = allTeams.filter(t => t.name !== userTeam);
            let chosenOpponent = opponentsList[Math.floor(Math.random() * opponentsList.length)];
            
            document.getElementById('teamHome').innerText = userTeam;
            document.getElementById('teamAway').innerText = chosenOpponent.name;

            // حساب قوة فريق المستخدم بناءً على اللعيبة المشترية (لو فيه لاعبين في الـ squad)
            let myPlayers = JSON.parse(localStorage.getItem('myTeamPlayers')) || [];
            let squadBonus = myPlayers.reduce((sum, p) => sum + (p.rating || 75), 0) / (myPlayers.length || 1);
            if (myPlayers.length === 0) squadBonus = 70; // قوة افتراضية لو مفيش لاعبين

            // محاكاة أهداف غير متوقعة تعتمد نسبياً على قوة الفريق
            let userGoals = Math.floor(Math.random() * (squadBonus > 85 ? 5 : 4));
            let opponentGoals = Math.floor(Math.random() * 4);

            let userObj = allTeams.find(t => t.name === userTeam);
            let oppObj = allTeams.find(t => t.name === chosenOpponent.name);

            userObj.played += 1;
            oppObj.played += 1;

            let resultMsg = "";
            if (userGoals > opponentGoals) {
                userObj.pts += 3;
                coins += 300;
                resultMsg = `🎉 انتصار عظيم (${userGoals}-${opponentGoals}) على ${chosenOpponent.name}! كسبت 350 عملة.`;
            } else if (userGoals === opponentGoals) {
                userObj.pts += 1;
                oppObj.pts += 1;
                coins += 120;
                resultMsg = `🤝 تعادل مثير (${userGoals}-${opponentGoals}) مع ${chosenOpponent.name}. كسبت 120 عملة.`;
            } else {
                oppObj.pts += 3;
                resultMsg = `❌ هزيمة مريرة (${userGoals}-${opponentGoals}) أمام ${chosenOpponent.name}. عزز فريقك من المتجر!`;
            }

            // محاكاة باقي نتائج فرق الدوري في هذه الجولة لكي يتغير الجدول بالكامل
            allTeams.forEach(team => {
                if (team.name !== userTeam && team.name !== chosenOpponent.name) {
                    team.played += 1;
                    let randOutcome = Math.random();
                    if (randOutcome < 0.4) team.pts += 3; // فوز
                    else if (randOutcome < 0.7) team.pts += 1; // تعادل
                }
            });

            currentRound++;
            localStorage.setItem('leagueRound', currentRound);
            localStorage.setItem('leagueStandings', JSON.stringify(allTeams));
            localStorage.setItem('userCoins', coins);
            document.getElementById('playerCoins').innerText = coins;
            document.getElementById('currentRoundTitle').innerText = "الجولة رقم: " + (currentRound - 1);
            document.getElementById('matchOutcome').innerHTML = resultMsg;

            updateTableUI();
        }

        function updateTableUI() {
            // ترتيب الجدول تنازلياً حسب النقاط
            allTeams.sort((a, b) => b.pts - a.pts);
            
            let tbody = document.getElementById('standingsTableBody');
            tbody.innerHTML = '';
            allTeams.forEach((team, index) => {
                let isUser = team.name === userTeam ? "color: var(--accent); font-weight:900;" : "";
                tbody.innerHTML += `
                    <tr style="${isUser}">
                        <td>${index + 1}. ${team.name}</td>
                        <td>${team.played}</td>
                        <td>${team.pts}</td>
                    </tr>
                `;
            });
        }
    </script>

</body>
</html>
