<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Ultimate 20-Team League & 32-Team UCL System</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        .game-viewport {
            width: 900px; height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px 30px;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 8px 20px; border-radius: 15px;
        }

        .match-title { font-size: 14px; font-weight: 900; color: var(--gold); }

        .coins-container {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold);
            padding: 4px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 15px;
        }

        .league-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 410px;
        }

        .card-box {
            background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 18px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;
        }

        .section-heading { font-size: 13px; font-weight: bold; color: var(--cyan); margin-bottom: 8px; text-align: center; }

        .table-wrapper { overflow-y: auto; height: 290px; }
        .table-wrapper::-webkit-scrollbar { width: 5px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; color: var(--text-main); text-align: center; }
        th, td { padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: var(--gold); background: rgba(0,0,0,0.6); }

        .match-center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }

        .vs-display {
            font-size: 15px; font-weight: bold; color: var(--text-main);
            background: rgba(0,0,0,0.5); border: 2px solid var(--pink);
            padding: 10px; border-radius: 15px; width: 100%;
        }

        .match-result-text { font-size: 11px; color: var(--accent); min-height: 25px; line-height: 1.4; }

        .play-btn {
            background: linear-gradient(45deg, var(--accent), var(--cyan));
            border: none; color: #020408; padding: 10px 20px; border-radius: 25px;
            font-weight: 900; font-size: 13px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 15px var(--accent-glow); width: 100%; text-align: center;
        }
        .play-btn:hover { transform: scale(1.03); }

        .back-btn {
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
            padding: 5px 15px; border-radius: 30px; cursor: pointer; font-size: 12px; font-weight: bold; text-decoration: none;
        }

        .mode-nav { display: flex; gap: 5px; }
        .mode-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--cyan); color: #fff; padding: 5px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div id="tournamentTitle" class="match-title">🏆 دوري الـ 20 نادياً ودوري أبطال أوروبا (32 فريقاً)</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="league-container">
            <div class="card-box">
                <div id="tableHeading" class="section-heading">📊 جدول الترتيب</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>النادي</th>
                                <th>لعب</th>
                                <th>نقاط</th>
                            </tr>
                        </thead>
                        <tbody id="standingsTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card-box match-center-box">
                <div id="roundIndicator" class="section-heading">الجولة: 1 / 38</div>
                
                <div class="vs-display">
                    <div id="teamHome">ناديك</div>
                    <div style="font-size: 10px; color: var(--gold); margin: 2px 0;">VS (حسب قوة تشكيلتك ⭐)</div>
                    <div id="teamAway" style="color: var(--pink);">جاري تحديد الخصم...</div>
                </div>

                <div id="matchOutcome" class="match-result-text">قوة تشكيلتك الأساسية تحدد تفوقك وفرص الفوز بالألقاب! ⚡</div>

                <button class="play-btn" onclick="startLiveMatch()">دخول الماتش الحي وتطبيق النتيجة 🏟️</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="welcome.html" class="back-btn">← رجوع للنادي</a>
            <div class="mode-nav">
                <button class="mode-btn" onclick="switchMode('league')">الدوري (20 فريق)</button>
                <button class="mode-btn" onclick="switchMode('ucl')" style="border-color:var(--gold); color:var(--gold);">دوري الأبطال (32 فريق)</button>
            </div>
        </div>
    </div>

    <script>
        let userTeam = localStorage.getItem('selectedTeam') || 'ناديك';
        let coins = parseInt(localStorage.getItem('userCoins')) || 1000;
        document.getElementById('playerCoins').innerText = coins;

        let currentMode = localStorage.getItem('careerMode') || 'league';
        let leagueRound = parseInt(localStorage.getItem('leagueRound')) || 1;
        let uclRound = parseInt(localStorage.getItem('uclRound')) || 1;

        // 1. جدول الـ 20 فريقاً الحقيقيين في الدوري الإنجليزي الممتاز
        let premier20 = JSON.parse(localStorage.getItem('premierLeague20')) || [
            { name: userTeam, played: 0, pts: 0 },
            { name: "أرسنال", played: 0, pts: 0 },
            { name: "مانشستر سيتي", played: 0, pts: 0 },
            { name: "ليفربول", played: 0, pts: 0 },
            { name: "تشيلسي", played: 0, pts: 0 },
            { name: "توتنهام", played: 0, pts: 0 },
            { name: "مانشستر يونايتد", played: 0, pts: 0 },
            { name: "نيوكاسل يونايتد", played: 0, pts: 0 },
            { name: "أستون فيلا", played: 0, pts: 0 },
            { name: "برايتون", played: 0, pts: 0 },
            { name: "وست هام يونايتد", played: 0, pts: 0 },
            { name: "كريستال بالاس", played: 0, pts: 0 },
            { name: "فولهام", played: 0, pts: 0 },
            { name: "برينتفورد", played: 0, pts: 0 },
            { name: "وولفرهامبتون", played: 0, pts: 0 },
            { name: "إيفرتون", played: 0, pts: 0 },
            { name: "نوتنغهام فورست", played: 0, pts: 0 },
            { name: "بورنموث", played: 0, pts: 0 },
            { name: "ليستر سيتي", played: 0, pts: 0 },
            { name: "إيبسويتش تاون", played: 0, pts: 0 }
        ];

        // 2. جدول الـ 32 فريقاً الحقيقيين في دوري أبطال أوروبا (تشمل الأربعة الأوائل المتأهلين من الدوري + الكبار)
        let ucl32 = JSON.parse(localStorage.getItem('uclLeague32')) || [
            { name: userTeam, played: 0, pts: 0 },
            { name: "ريال مدريد", played: 0, pts: 0 },
            { name: "برشلونة", played: 0, pts: 0 },
            { name: "أتلتيكو مدريد",played: 0, pts: 0 },
            { name: "جيرونا", played: 0, pts: 0 },
            { name: "مانشستر سيتي", played: 0, pts: 0 },
            { name: "أرسنال", played: 0, pts: 0 },
            { name: "ليفربول", played: 0, pts: 0 },
            { name: "أستون فيلا", played: 0, pts: 0 },
            { name: "بايرن ميونخ", played: 0, pts: 0 },
            { name: "بوروسيا دورتموند", played: 0, pts: 0 },
            { name: "باير ليفركوزن", played: 0, pts: 0 },
            { name: "لايبزيغ", played: 0, pts: 0 },
            { name: "شتوتغارت", played: 0, pts: 0 },
            { name: "إنتر ميلان", played: 0, pts: 0 },
            { name: "إياسي ميلان", played: 0, pts: 0 },
            { name: "يوفنتوس", played: 0, pts: 0 },
            { name: "أتلانتا", played: 0, pts: 0 },
            { name: "بولونيا", played: 0, pts: 0 },
            { name: "باريس سان جيرمان", played: 0, pts: 0 },
            { name: "موناكو", played: 0, pts: 0 },
            { name: "بريست", played: 0, pts: 0 },
            { name: "ليل", played: 0, pts: 0 },
            { name: "سبورتنج لشبونة", played: 0, pts: 0 },
            { name: "بنفيكا", played: 0, pts: 0 },
            { name: "بورتو", played: 0, pts: 0 },
            { name: "أياكس أمستردام", played: 0, pts: 0 },
            { name: "آيندهوفن", played: 0, pts: 0 },
            { name: "سلتيك", played: 0, pts: 0 },
            { name: "شاختار دونيتسك", played: 0, pts: 0 },
            { name: "غلطة سراي", played: 0, pts: 0 },
            { name: "ريد بول سالزبورغ", played: 0, pts: 0 }
        ];

        // التأكد من وجود فريق المستخدم في الجداول
        if(!premier20.some(t => t.name === userTeam)) premier20[0].name = userTeam;
        if(!ucl32.some(t => t.name === userTeam)) ucl32[0].name = userTeam;

        localStorage.setItem('premierLeague20', JSON.stringify(premier20));
        localStorage.setItem('uclLeague32', JSON.stringify(ucl32));

        renderUI();

        function switchMode(mode) {
            currentMode = mode;
            localStorage.setItem('careerMode', mode);
            renderUI();
        }

        function renderUI() {
            let tbody = document.getElementById('standingsTableBody');
            tbody.innerHTML = '';

            let activeList, title;
            if (currentMode === 'league') {
                activeList = premier20;
                title = `📊 جدول الدوري الإنجليزي (20 فريقاً) - جولة ${leagueRound}/38`;
                document.getElementById('tournamentTitle').innerText = "🏆 البريميرليج (20 فريق حقيقي)";
                document.getElementById('roundIndicator').innerText = `الجولة: ${leagueRound} / 38`;
            } else {
                activeList = ucl32;
                title = `⭐ دوري أبطال أوروبا (32 فريقاً) - جولة ${uclRound}/8`;
                document.getElementById('tournamentTitle').innerText = "⭐ دوري أبطال أوروبا (32 فريقاً مع المتأهلين)";
                document.getElementById('roundIndicator').innerText = `الجولة الأوروبية: ${uclRound} / 8`;
            }

            document.getElementById('tableHeading').innerText = title;

            activeList.sort((a, b) => b.pts - a.pts);
            activeList.forEach((t, i) => {
                let isUser = t.name === userTeam ? "color: var(--accent); font-weight:900;" : "";
                tbody.innerHTML += `<tr style="${isUser}"><td>${i + 1}. ${t.name}</td><td>${t.played}</td><td>${t.pts}</td></tr>`;
            });

            // اختيار الخصم القادم
            let opponents = activeList.filter(t => t.name !== userTeam);
            let chosenOpp = opponents[Math.floor(Math.random() * opponents.length)] || { name: "العملاق الأوروبي" };
            
            document.getElementById('teamHome').innerText = userTeam;
            document.getElementById('teamAway').innerText = chosenOpp.name;
            localStorage.setItem('currentOpponent', chosenOpp.name);
        }

        // دخول الماتش الحي وربط النتيجة بقوة التشكيلة
        function startLiveMatch() {
            // جلب تشكيلة اللاعب المحسوبة من squad.html وحساب متوسط تقييمها
            let optimizedSquad = JSON.parse(localStorage.getItem('optimizedSquad')) || [];
            let squadRating = 85; // تقييم افتراضي أساسي
            
            if (optimizedSquad.length > 0) {
                let total = optimizedSquad.reduce((sum, p) => sum + (p.rating || 90), 0);
                squadRating = Math.round(total / optimizedSquad.length);
            }

            // حفظ قوة التشكيلة لتحديد نسبة الفوز والأهداف في صفحة الماتش الحي
            localStorage.setItem('userSquadPower', squadRating);
            window.location.href = 'live_match.html';
        }
    </script>

</body>
</html>
