<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOKER GAMES - الألعاب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #dfd2be;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-viewport {
            width: 100vw;
            height: 100vh;
            /* الخلفية النقطية بنفس ألوان الصورة بالظبط */
            background-color: #dfd2be;
            background-image: radial-gradient(#c8b9a1 22%, transparent 22%);
            background-size: 16px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 14px 10px 14px;
            position: relative;
            overflow-y: auto;
        }

        /* رسمة البرق الكبيرة باللون الأصفر والحدود الداكنة بالمنتصف */
        .big-lightning-bg {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%) rotate(12deg);
            font-size: 380px;
            color: #facc15;
            text-shadow: 
                -4px -4px 0 #000, 
                 4px -4px 0 #000, 
                -4px  4px 0 #000, 
                 4px  4px 0 #000,
                 0px 10px 20px rgba(0,0,0,0.3);
            z-index: 1;
            pointer-events: none;
            opacity: 0.95;
            line-height: 1;
        }

        /* --- 1. رأس الصفحة --- */
        .page-header {
            text-align: center;
            z-index: 5;
            margin-top: 10px;
            margin-bottom: 22px;
        }

        .page-title {
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                3px 3px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                0 5px 0 #000;
            letter-spacing: 1px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        /* --- 2. شبكة المربعات (2x2) --- */
        .games-grid {
            width: 100%;
            max-width: 390px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            z-index: 5;
            padding-bottom: 15px;
        }

        /* المربع/الكارت الخالي من أي كتابة */
        .game-card {
            width: 100%;
            aspect-ratio: 1 / 1.15;
            background: #000000;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            transition: transform 0.15s ease;
            border: 3px solid #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .game-card:active {
            transform: scale(0.96);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        /* زر العودة للرئيسية */
        .back-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 10;
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        
        <div class="big-lightning-bg">⚡</div>

        <div class="back-btn" onclick="window.location.href='main.html'">➔</div>

        <div class="page-header">
            <div class="page-title">الألعاب</div>
            <div class="page-subtitle">اختر لعبة لإنشاء غرفة</div>
        </div>

        <div class="games-grid">

            <div class="game-card" onclick="openGamePage('game1.html')">
                <img src="1.png" alt="" onerror="this.src='1.jpg';">
            </div>

            <div class="game-card" onclick="openGamePage('game2.html')">
                <img src="2.png" alt="" onerror="this.src='2.jpg';">
            </div>

            <div class="game-card" onclick="openGamePage('game3.html')">
                <img src="3.png" alt="" onerror="this.src='3.jpg';">
            </div>

            <div class="game-card" onclick="openGamePage('game4.html')">
                <img src="4.png" alt="" onerror="this.src='4.jpg';">
            </div>

        </div>
    </div>

    <script>
        function openGamePage(pageUrl) {
            window.location.href = pageUrl;
        }
    </script>
</body>
</html>
