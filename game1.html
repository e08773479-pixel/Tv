<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOKER AI - Big 5 Leagues & Egyptian Draft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #020617;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100vw;
            max-width: 480px;
            height: 100vh;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2);
            border: 1px solid #1e293b;
        }

        /* Top Bar Header */
        .top-bar {
            background: linear-gradient(180deg, #020617, #0f172a);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ffcc;
        }

        .club-title {
            font-size: 16px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.3);
        }

        .squad-power {
            font-size: 11px;
            color: #94a3b8;
        }

        .wallet-box {
            background: #000;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #fbbf24;
            font-size: 12px;
            font-weight: 900;
            color: #fbbf24;
        }

        /* Screen Wrapper */
        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Category Label */
        .section-label {
            font-size: 12px;
            font-weight: 900;
            color: #00ffcc;
            margin-top: 4px;
        }

        /* Horizontal Scroll Chips */
        .chip-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .chip-container::-webkit-scrollbar { display: none; }

        .chip-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .chip-btn.active {
            background: #00ffcc;
            color: #000;
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
        }

        /* PRO FIFA FUT CARD DESIGN */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .fut-card {
            width: 100%;
            height: 215px;
            border-radius: 16px;
            position: relative;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.2s;
            cursor: pointer;
            overflow: hidden;
        }

        .fut-card:active { transform: scale(0.95); }

        .card-gold { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #b38728 100%); color: #1e1100; }
        .card-icon { background: linear-gradient(135deg, #090d16 0%, #1e293b 100%); color: #00ffcc; border-color: #00ffcc; }
        .card-special { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); color: #fff; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-ovr { font-size: 26px; font-weight: 900; line-height: 1; }
        .card-pos { font-size: 10px; font-weight: 900; }

        .card-avatar { font-size: 44px; text-align: center; margin: 2px 0; }
        .card-name { text-align: center; font-weight: 900; font-size: 11px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: rgba(0,0,0,0.35);
            padding: 4px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
            text-align: center;
        }

        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: bold; }

        /* Action Buttons */
        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            background: linear-gradient(135deg, #00ffcc, #0284c7);
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.3);
            text-align: center;
        }

        .btn-skip { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }

        /* Match Overlay */
        .match-overlay {
            position: absolute;
            inset: 0;
            background: #020617;
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 16px;
        }

        .match-overlay.active { display: flex; }

        .scoreboard {
            background: #0f172a;
            border-radius: 16px;
            padding: 16px;
            border: 2px solid #00ffcc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-num { font-size: 38px; font-weight: 900; color: #00ffcc; }

        .ai-log {
            flex: 1;
            background: #000;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            text-align: right;
            border: 1px solid #1e293b;
        }

        .log-item { background: #111827; padding: 8px; border-radius: 6px; border-right: 3px solid #00ffcc; }
        .log-item.goal { border-right-color: #fbbf24; background: rgba(251, 191, 36, 0.15); }
    </style>
</head>

                    <div style="font-size: 11px; color: #94a3b8;">فريقك المختاط</div>
                    <div class="score-num" id="homeScore">0</div>
                </div>
                <div style="font-size: 18px; font-weight: 900; color: #ef4444;" id="matchClock">00'</div>
                <div style="text-align: center;">
                    <div style="font-size: 11px; color: #94a3b8;">أساطير أوروبا AI</div>
                    <div class="score-num" id="awayScore">0</div>

            </div>

            </div>

            <div style="display: flex; gap: 8px;">
                <button class="btn-action" id="startSimBtn" onclick="runMatch(false)">تشغيل المحاكاة ⏱️</button>
                <button class="btn-action btn-skip" id="skipBtn" onclick="runMatch(true)">تخطي للنتيجة (Skip) ⚡</button>
            </div>
            <button class="btn-action" id="exitBtn" onclick="closeMatch()" style="display: none; margin-top: 8px;">خروج وإعادة التحدي 🔄</button>
        </div>
    </div>

        let currentLeagueKey = "Premier";
        let currentClubIndex = 0;
        let mySquad = [];

        function selectLeague(leagueKey, btn) {
            currentLeagueKey = leagueKey;
            currentClubIndex = 0;

            document.querySelectorAll('#leagueChips .chip-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderClubs();
            renderCards();
        }

        function renderClubs() {
            const clubsList = document.getElementById('clubsChipList');
            clubsList.innerHTML = '';

            const clubs = bigLeaguesData[currentLeagueKey];
            clubs.forEach((club, index) => {
                const activeClass = index === currentClubIndex ? 'active' : '';
                clubsList.innerHTML += `
                    <button class="chip-btn ${activeClass}" onclick="selectClub(${index}, this)">
                        ${club.badge} ${club.clubName}
                    </button>
                `;
            });
        }

        function selectClub(clubIndex, btn) {
            currentClubIndex = clubIndex;
            document.querySelectorAll('#clubsChipList .chip-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const activeClub = bigLeaguesData[currentLeagueKey][currentClubIndex];
            if (!activeClub) return;

            activeClub.players.forEach(player => {
                const isSelected = mySquad.some(item => item.id === player.id);

                grid.innerHTML += `
                    <div class="fut-card ${player.type}" onclick="togglePlayer(${player.id})">
                        <div class="card-header">
                            <div>
                                <div class="card-ovr">${player.ovr}</div>
                                <div class="card-pos">${player.pos}</div>
                            </div>
                            <div style="font-size: 15px;">${player.flag}</div>
                        </div>
                        <div class="card-avatar">${player.emoji}</div>
                        <div class="card-name">${player.name}</div>
                        <div class="card-stats">
                            <div>PAC<br>${player.pac}</div>
                            <div>SHO<br>${player.sho}</div>
                            <div>PAS<br>${player.pas}</div>
                        </div>
                        <div class="card-footer">
                            <span style="color:#fbbf24;">${player.price} 🪙</span>
                            <span style="color:${isSelected ? '#00ffcc' : '#fff'}; font-weight:900;">
                                ${isSelected ? 'محدد ✓' : 'إضافة ➕'}
                            </span>
                        </div>
                    </div>
                `;
            });
        }

        function togglePlayer(id) {
            let playerFound = null;
            Object.keys(bigLeaguesData).forEach(lKey => {
                bigLeaguesData[lKey].forEach(club => {
                    const p = club.players.find(item => item.id === id);
                    if (p) playerFound = p;
                });
            });

            if (!playerFound) return;

            const index = mySquad.findIndex(p => p.id === id);
            if (index > -1) {
                mySquad.splice(index, 1);
            } else {
                if (mySquad.length >= 17) {
                    alert("اكتمل القوام الأقصى! (17 لاعباً)");
                    return;
                }
                mySquad.push(playerFound);
            }

            document.getElementById('pickedCount').innerText = `${mySquad.length} / 17`;

            const totalOvr = mySquad.reduce((acc, curr) => acc + curr.ovr, 0);
            const avg = mySquad.length > 0 ? Math.round(totalOvr / mySquad.length) : 0;
            document.getElementById('squadOvr').innerText = avg;

            const btn = document.getElementById('readyBtn');
            if (mySquad.length === 17) {
                btn.disabled = false;
                btn.style.opacity = 1;
                btn.innerText = "جاهز لبدء المباراة 🚀";
            } else {
                btn.disabled = true;
                btn.style.opacity = 0.4;
                btn.innerText = `حدد 17 لاعباً للاستمرار (${mySquad.length}/17)`;
            }

            renderCards();
        }

        function openMatchOverlay() {
            document.getElementById('matchOverlay').classList.add('active');
        }

        function closeMatch() {
            location.reload();
        }

        function runMatch(isSkip) {
            document.getElementById('startSimBtn').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';

            const logBox = document.getElementById('aiLogBox');
            logBox.innerHTML = '';

            const avgOvr = parseInt(document.getElementById('squadOvr').innerText) || 80;
            let home = 0;
            let away = 0;

            if (isSkip) {
                home = Math.floor(Math.random() * 3) + (avgOvr > 85 ? 2 : 0);
                away = Math.floor(Math.random() * 2);

                document.getElementById('homeScore').innerText = home;
                document.getElementById('awayScore').innerText = away;
                document.getElementById('matchClock').innerText = "90'";

                logBox.innerHTML = `<div class="log-item goal">⚡ نتيجة التخطي المباشرة بالذكاء الاصطناعي: ${home} - ${away}</div>`;
                document.getElementById('exitBtn').style.display = 'block';
                return;
            }

            let min = 0;
            const timer = setInterval(() => {
                min += 6;
                document.getElementById('matchClock').innerText = `${min}'`;

                if (Math.random() * 100 < (avgOvr / 2.3)) {
                    home++;
                    const scorer = mySquad[Math.floor(Math.random() * mySquad.length)];
                    logBox.innerHTML = `<div class="log-item goal">⚽ دقيقة ${min}': جووووول! ${scorer.name} يسجل هدفاً رائعاً!</div>` + logBox.innerHTML;
                } else if (Math.random() * 100 > 82) {
                    away++;
                    logBox.innerHTML = `<div class="log-item">⚠️ دقيقة ${min}': هدف للخصم بعد هجمة مرتدة!</div>` + logBox.innerHTML;
                }

                document.getElementById('homeScore').innerText = home;
                document.getElementById('awayScore').innerText = away;

                if (min >= 90) {
                    clearInterval(timer);
                    logBox.innerHTML = `<div class="log-item goal">🏁 أطلق الحكم صافرة النهاية!</div>` + logBox.innerHTML;
                    document.getElementById('exitBtn').style.display = 'block';
                }
            }, 500);
        }

        // تشغيل العرض الأولي
        renderClubs();
        renderCards();
    </script>
</body>
</html>
