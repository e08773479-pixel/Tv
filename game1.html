<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --pink: #ff007f;
            --cyan: #00f0ff;
            --text-main: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-viewport {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
        }

        .game-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            padding: 40px;
            z-index: 2;
        }

        .logo-container {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .joker-image-header {
            font-size: 75px;
            filter: drop-shadow(0 0 30px var(--pink));
            animation: floatJoker 3s infinite ease-in-out;
        }

        @keyframes floatJoker {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .game-logo-main {
            font-size: 68px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(45deg, var(--accent), var(--cyan), var(--gold), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px var(--accent-glow));
            transform: skew(-6deg);
            display: inline-block;
            letter-spacing: 5px;
        }

        .game-logo-sub {
            font-size: 16px;
            font-weight: 800;
            color: var(--cyan);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #008844 100%);
            color: #020408;
            border: none;
            padding: 20px 55px;
            border-radius: 50px;
            font-size: 23px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 40px var(--accent-glow);
            transition: 0.2s ease;
            letter-spacing: 0.8px;
            margin-bottom: 20px;
        }

        .action-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #1aff99 0%, var(--accent) 100%);
            box-shadow: 0 15px 50px #00ff88;
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="game-screen">
            <div></div>
            <div class="logo-container">
                <div class="joker-image-header">🃏</div>
                <div class="game-logo-main">JOKER GAME</div>
                <div class="game-logo-sub">Ultimate Football Edition</div>
            </div>
            <div>
                <button class="action-btn" onclick="window.location.href='game5.html'">اختر الان الدوري الخاص بك</button>
            </div>
        </div>
    </div>

</body>
</html>
