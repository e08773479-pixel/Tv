<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجوكر جيم - أسطورة كرة القدم</title>
    <style>
        :root {
            --bg-dark: #05070b;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.6);
            --gold: #f39c12;
            --text-main: #ffffff;
            --text-secondary: #a0aec0;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111b2b 50%, #05070b 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* خلفية تفاعلية متحركة (أشكال مضيئة وكرات في الخلفية) */
        .bg-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .floating-ball {
            position: absolute;
            font-size: 30px;
            opacity: 0.15;
            animation: floatAround 12s infinite linear;
        }

        @keyframes floatAround {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(-100vh) translateX(100px) rotate(360deg); }
        }

        /* الحاوية الرئيسية بتصميم زجاجي احترافي */
        .game-container {
            width: 100%;
            max-width: 850px;
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(0, 255, 136, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            padding: 55px 35px;
            position: relative;
            z-index: 2;
        }

        /* شريط الكلام المتحرك في الأعلى (تأثير انزلاق وتوهج) */
        .ticker-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 0;
            border-radius: 50px;
            border: 1px solid rgba(243, 156, 18, 0.3);
        }

        .ticker-text {
            display: inline-block;
            animation: tickerScroll 15s linear infinite;
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        @keyframes tickerScroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* اسم اللعبة الرئيسي مع تأثير تدرج ألوان ونبض */
        .game-logo {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent), #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 15px;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 5px rgba(0,255,136,0.3)); }
            100% { filter: drop-shadow(0 0 20px rgba(0,255,136,0.8)); }
        }

        /* كورة متحركة بجرافيك عالي في المنتصف */
        .ball-graphics {
            font-size: 85px;
            margin: 25px 0 35px 0;
            animation: bounceAndSpin 3s infinite ease-in-out;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
        }

        @keyframes bounceAndSpin {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(180deg); }
        }

        /* الزر الوحيد المطلوب في الأسفل */
        .btn-wrapper {
            margin-top: 25px;
        }

        .main-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #00b359 100%);
            color: #05070b;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-weight: 900;
            cursor: pointer;
            font-size: 21px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .main-btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 255, 136, 0.7);
            background: linear-gradient(135deg, #1aff99 0%, var(--accent) 100%);
        }

        .main-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="bg-particles">
        <div class="floating-ball" style="left: 10%; animation-duration: 9s;">⚽</div>
        <div class="floating-ball" style="left: 30%; animation-duration: 14s; animation-delay: 2s;">⚽</div>
        <div class="floating-ball" style="left: 70%; animation-duration: 11s; animation-delay: 1s;">⚽</div>
        <div class="floating-ball" style="left: 85%; animation-duration: 16s; animation-delay: 4s;">⚽</div>
    </div>

    <div class="game-container">
        <div class="ticker-container">
            <div class="ticker-text">🔥 الشغف الحقيقي، المجد، والبطولات الكبرى في انتظارك! أنشئ تاريخك الكروي الآن وابدأ التحدي الاحترافي ⚽🏆</div>
        </div>

        <div class="game-logo">الجوكر جيم</div>
        
        <div class="ball-graphics">⚽</div>

        <div class="btn-wrapper">
            <button class="main-btn" onclick="openLeagueSelection()">اختر الدوري الخاص بك الآن</button>
        </div>
    </div>

    <script>
        // دالة تفاعلية للزر للانتقال للخطوة القادمة لاحقاً
        function openLeagueSelection() {
            alert('تم تفعيل المؤثرات البصرية بنجاح! جاهز للانتقال لقائمة الدوريات في الجزء القادم.');
        }
    </script>

</body>
</html>
