<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOKER GAMES - نظام التصنيف العالمي</title>
    <style>
        :root {
            --joker-purple: #7c3aed;
            --joker-green: #22c55e;
            --joker-gold: #facc15;
            --joker-dark: #0f172a;
            --joker-card: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body {
            background: var(--joker-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* حاوية الموبايل */
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 450px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 2px solid #334155;
        }

        /* رأس الصفحة - المعلومات الأساسية */
        .header {
            text-align: center;
            margin-top: 20px;
            position: relative;
        }

        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            border: 4px solid var(--joker-purple);
            position: relative;
            background: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
        }

        .level-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: var(--joker-gold);
            color: black;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 15px;
            border: 2px solid black;
            font-size: 14px;
        }

        .user-name { font-size: 26px; font-weight: 900; margin-top: 15px; letter-spacing: 1px; }
        .rank-name { color: var(--joker-green); font-weight: 800; font-size: 16px; margin-top: 5px; text-transform: uppercase; }

        /* نظام الليفل والـ XP */
        .xp-section {
            background: var(--joker-card);
            border-radius: 20px;
            padding: 20px;
            margin: 25px 0;
            border: 1px solid #334155;
        }

        .xp-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        
        .progress-container {
            width: 100%;
            height: 15px;
            background: #0f172a;
            border-radius: 10px;
            border: 1px solid #475569;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--joker-purple), var(--joker-green));
            transition: width 0.5s ease-in-out;
            box-shadow: 0 0 10px var(--joker-purple);
        }

        /* شبكة الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #334155;
        }

        .stat-value { font-size: 22px; font-weight: 900; display: block; }
        .stat-label { font-size: 12px; color: #94a3b8; font-weight: bold; }

        /* الأزرار */
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-edit { background: var(--joker-purple); color: white; }
        .btn-reset { background: #ef4444; color: white; margin-top: auto; }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="back-btn" onclick="history.back()">✖</div>

        <div class="header">
            <div class="avatar-wrapper">
                <span id="displayAvatar">🃏</span>
                <div class="level-badge">LVL <span id="displayLevel">1</span></div>
            </div>
            <h1 class="user-name" id="displayName">اللاعب الجوكر</h1>
            <p class="rank-name" id="displayRank">برونزي III</p>
        </div>

        <div class="xp-section">
            <div class="xp-header">
                <span>التقدم للمستوى التالي</span>
                <span id="xpText">0 / 1000 XP</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="xpBar"></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="statTotalScore">0</span>
                <span class="stat-label">إجمالي النقاط ⭐</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statWinRate">0%</span>
                <span class="stat-label">نسبة الفوز 🏆</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statWins">0</span>
                <span class="stat-label">انتصارات</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statLosses">0</span>
                <span class="stat-label">هزائم</span>
            </div>
        </div>

        <button class="btn btn-edit" onclick="editProfile()">✏️ تعديل الملف الشخصي</button>
        <button class="btn btn-reset" onclick="resetSystem()">🔄 تصفير كافة البيانات</button>
    </div>

    <script>
        // دالة تحديث وعرض البيانات
        function updateProfileUI() {
            // سحب البيانات من الملفات الأخرى (LocalStorage)
            let score = parseInt(localStorage.getItem('joker_total_score')) || 0;
            let wins = parseInt(localStorage.getItem('joker_wins')) || 0;
            let losses = parseInt(localStorage.getItem('joker_losses')) || 0;
            let name = localStorage.getItem('joker_name') || 'اللاعب الجوكر';
            let avatar = localStorage.getItem('joker_avatar') || '🃏';

            // 1. حساب الليفل (كل 1000 نقطة ليفل)
            let level = Math.floor(score / 1000) + 1;
            if (level > 100) level = 100; // أقصى ليفل 100

            // 2. حساب الـ XP داخل الليفل الحالي
            let currentLevelXP = score % 1000;
            let xpPercent = (currentLevelXP / 1000) * 100;

            // 3. حساب التصنيف (Rank)
            let rank = "";
            if (score < 3000) rank = "برونزي III";
            else if (score < 10000) rank = "فضي II";
            else if (score < 30000) rank = "ذهبي I";
            else if (score < 60000) rank = "بلاتينيوم 💎";
            else if (score < 100000) rank = "ماستر ⚔️";
            else rank = "أسطورة الجوكر 🏆";

            // 4. حساب نسبة الفوز
            let totalGames = wins + losses;
            let winRate = totalGames > 0 ? Math.round((wins / totalGames) * 100) : 0;

            // تحديث العناصر في الصفحة
            document.getElementById('displayName').innerText = name;
            document.getElementById('displayAvatar').innerText = avatar;
            document.getElementById('displayLevel').innerText = level;
            document.getElementById('displayRank').innerText = rank;
            document.getElementById('statTotalScore').innerText = score.toLocaleString();
            document.getElementById('statWins').innerText = wins;
            document.getElementById('statLosses').innerText = losses;
            document.getElementById('statWinRate').innerText = winRate + "%";
            document.getElementById('xpText').innerText = currentLevelXP + " / 1000 XP";
            document.getElementById('xpBar').style.width = xpPercent + "%";
        }

        // دالة التعديل
        function editProfile() {
            let newName = prompt("أدخل اسمك الجديد:", localStorage.getItem('joker_name') || "");
            if(newName) localStorage.setItem('joker_name', newName);
            updateProfileUI();
        }

        // دالة التصفير
        function resetSystem() {
            if(confirm("هل أنت متأكد من تصفير كل نقاطك وتصنيفك؟")) {
                localStorage.setItem('joker_total_score', 0);
                localStorage.setItem('joker_wins', 0);
                localStorage.setItem('joker_losses', 0);
                updateProfileUI();
            }
        }

        // التحديث عند الفتح
        window.onload = updateProfileUI;
    </script>
</body>
</html>
