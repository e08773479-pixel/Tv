<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب العالمية - Gaming Hub Pro</title>
    <style>
        :root {
            --bg-dark: #05070d;
            --panel-bg: #0f172a;
            --card-bg: #1e293b;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --alert-red: #ef4444;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hub-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* بروفايل احترافي ضخـم وثابت */
        .giant-profile-header {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #1e40af);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            border-bottom: 2px solid var(--accent-cyan);
        }

        .giant-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #ffffff;
            font-size: 42px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.25);
        }

        .giant-profile-header h1 {
            font-size: 24px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .tag-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            align-items: center;
        }

        .unique-id-tag {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 14px;
            border-radius: 20px;
            font-family: monospace;
            color: #facc15;
            font-weight: bold;
            font-size: 13px;
        }

        /* مؤشر جودة الإنترنت الحقيقي */
        .ping-indicator {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--accent-green);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bars {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 12px;
        }
        .bar { width: 3px; background: var(--accent-green); border-radius: 1px; }
        .b1 { height: 4px; }
        .b2 { height: 8px; }
        .b3 { height: 12px; }

        /* شريط الإحصائيات والسكور السحابي */
        .stats-hud {
            display: flex;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 0;
            text-align: center;
        }

        .hud-box {
            flex: 1;
            border-left: 1px solid var(--border-color);
        }
        .hud-box:last-child { border-left: none; }
        .hud-box span { display: block; font-size: 11px; color: var(--text-gray); }
        .hud-box strong { font-size: 17px; color: var(--accent-cyan); }

        /* أقسام المنصة */
        .main-scroll-area {
            padding: 16px;
            max-height: 420px;
            overflow-y: auto;
        }

        .module-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .module-box h3 {
            font-size: 15px;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--text-gray);
            display: block;
            margin-bottom: 4px;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: #fff;
            font-size: 13px;
        }

        .btn-custom {
            width: 100%;
            padding: 11px;
            background: var(--accent-green);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-custom:hover { opacity: 0.9; }

        /* شات احترافي وغرف الصوت */
        .chat-display-box {
            height: 150px;
            background: var(--bg-dark);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 10px;
            overflow-y: auto;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: right;
        }

        .chat-message-bubble {
            background: #25334f;
            padding: 7px 11px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: inline-block;
            max-width: 90%;
            word-break: break-word;
        }

        .action-buttons-row {
            display: flex;
            gap: 8px;
        }

        .mic-voice-btn {
            background: var(--accent-purple);
            flex: 1;
        }
        .mic-voice-btn.live-recording {
            background: var(--alert-red);
            animation: pulse-animation 1.2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #systemAlertMessage {
            font-size: 11px;
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <div class="giant-profile-header">
            <div class="giant-avatar" id="profileBigLetter">G</div>
            <h1 id="profileBigName">جاري تحميل اللاعب...</h1>
            <div class="tag-row">
                <div class="unique-id-tag" id="profileUniqueId">ID: -----</div>
                <div class="ping-indicator">
                    <span>نت ممتاز</span>
                    <div class="bars">
                        <div class="bar b1"></div>
                        <div class="bar b2"></div>
                        <div class="bar b3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-hud">
            <div class="hud-box">
                <span>السكور العام</span>
                <strong id="hudScore">8450</strong>
            </div>
            <div class="hud-box">
                <span>التصنيف العالمي</span>
                <strong style="color: #facc15;">#3 قمة</strong>
            </div>
            <div class="hud-box">
                <span>السيرفر الحالي</span>
                <strong id="hudServer">سيرفر #01</strong>
            </div>
        </div>

        <div class="main-scroll-area">
            <div class="module-box">
                <h3>🌐 اختيار السيرفر (100+ سيرفر متاح)</h3>
                <label>اختر السيرفر النشط الآن:</label>
                <select id="serverSelector" onchange="changeServerHub()">
                    <option value="Server-01">سيرفر #01 (الشرق الأوسط - ضغط عالي)</option>
                    <option value="Server-02">سيرفر #02 (الشرق الأوسط - مستقر)</option>
                    <option value="Server-03">سيرفر #03 (أوروبا الغربية)</option>
                    <option value="Server-10">سيرفر #10 (آسيا برو)</option>
                    <option value="Server-50">سيرفر #50 (الأمريكتين)</option>
                    <option value="Server-100">سيرفر #100 (السيرفر الرئيسي العالمي)</option>
                </select>
            </div>

            <div class="module-box">
                <h3>⚙️ إعدادات الحساب وتحديث السكور</h3>
                <label>اسم اللاعب الاحترافي:</label>
                <input type="text" id="inputProfileName" placeholder="اكتب اسمك المستعار..." />
                <button class="btn-custom" onclick="saveProfileChanges()">تحديث وحفظ البيانات</button>
            </div>

            <div class="module-box">
                <h3>🔍 البحث عن الأصدقاء (ID الحقيقي)</h3>
                <input type="text" id="searchIdTarget" placeholder="أدخل ID الصديق بدقة..." />
                <button class="btn-custom" style="background: var(--accent-cyan);" onclick="sendFriendRequestAction()">إرسال طلب صداقة</button>
                <div id="friendResponseLog" style="font-size: 11px; margin-top: 6px;"></div>
            </div>

            <div class="module-box">
                <h3>💬 شات السيرفر وغرفة الصوت الحية</h3>
                <div class="chat-display-box" id="serverChatBox">
                    <div class="chat-message-bubble"><b>النظام:</b> أهلاً بك في غرفة الشات الصوتية والكتابية.</div>
                </div>
                <input type="text" id="chatTextInput" placeholder="اكتب رسالة للسيرفر..." />
                <div class="action-buttons-row">
                    <button class="btn-custom" style="flex: 2;" onclick="sendServerChatText()">إرسال رسالة</button>
                    <button class="btn-custom mic-voice-btn" id="micVoiceToggleBtn" onclick="toggleMicrophoneVoice()">🎙️ صوت ميكروفون</button>
                </div>
                <div id="systemAlertMessage" style="color: var(--text-gray);"></div>
            </div>
        </div>
    </div>

    <script>
        // إعداد التشغيل التلقائي وتوليد الـ ID والبيانات عند الفتح
        window.onload = function() {
            let myId = localStorage.getItem('hub_user_id');
            let myName = localStorage.getItem('hub_user_name');
            let myScore = localStorage.getItem('hub_user_score');

            if (!myId) {
                myId = "HUB-PRO-" + Math.floor(10000 + Math.random() * 90000);
                localStorage.setItem('hub_user_id', myId);
            }

            if (!myName) {
                myName = "الأسطورة برو";
                localStorage.setItem('hub_user_name', myName);
            }

            if (!myScore) {
                myScore = "8450";
                localStorage.setItem('hub_user_score', myScore);
            }

            document.getElementById('profileUniqueId').innerText = "ID: " + myId;
            document.getElementById('profileBigName').innerText = myName;
            document.getElementById('profileBigLetter').innerText = myName.charAt(0);
            document.getElementById('inputProfileName').value = myName;
            document.getElementById('hudScore').innerText = myScore;
        };

        // تحديث البروفايل
        function saveProfileChanges() {
            let newName = document.getElementById('inputProfileName').value.trim();
            if (!newName) {
                alert("الرجاء كتابة اسم صحيح!");
                return;
            }
            localStorage.setItem('hub_user_name', newName);
            document.getElementById('profileBigName').innerText = newName;
            document.getElementById('profileBigLetter').innerText = newName.charAt(0);
            alert("تم حفظ البروفايل وتحديث السكور بنجاح تام!");
        }

        // تغيير السيرفر
        function changeServerHub() {
            let selectedServer = document.getElementById('serverSelector').value;
            document.getElementById('hudServer').innerText = selectedServer;
            let chatBox = document.getElementById('serverChatBox');
            let notice = document.createElement('div');
            notice.className = 'chat-message-bubble';
            notice.style.background = "#312e81";
            notice.innerHTML = `<b>النظام:</b> تم الانتقال بنجاح إلى [ ${selectedServer} ].`;
            chatBox.appendChild(notice);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // البحث عن الأصدقاء
        function sendFriendRequestAction() {
            let targetId = document.getElementById('searchIdTarget').value.trim();
            let logDiv = document.getElementById('friendResponseLog');
            let myId = localStorage.getItem('hub_user_id');

            if (!targetId) {
                logDiv.style.color = "var(--alert-red)";
                logDiv.innerText = "الرجاء إدخال ID صحيح للبحث.";
                return;
            }

            if (targetId === myId) {
                logDiv.style.color = "orange";
                logDiv.innerText = "لا يمكنك إضافة نفسك كصديق!";
                return;
            }

            logDiv.style.color = "var(--accent-green)";
            logDiv.innerText = `تم إرسال طلب الصداقة بنجاح إلى المعرف: ${targetId}`;
        }

        // إرسال رسائل الشات
        function sendServerChatText() {
            let inputField = document.getElementById('chatTextInput');
            let text = inputField.value.trim();
            let chatBox = document.getElementById('serverChatBox');
            let currentName = localStorage.getItem('hub_user_name');

            if (!text) return;

            let bubble = document.createElement('div');
            bubble.className = 'chat-message-bubble';
            bubble.innerHTML = `<b>${currentName}:</b> ${text}`;
            chatBox.appendChild(bubble);

            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // تفعيل الميكروفون والصوت الحي
        let micActiveState = false;
        function toggleMicrophoneVoice() {
            let micBtn = document.getElementById('micVoiceToggleBtn');
            let alertMsg = document.getElementById('systemAlertMessage');

            if (!micActiveState) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(function(stream) {
                    micActiveState = true;
                    micBtn.classList.add('live-recording');
                    micBtn.innerText = "🔴 جاري البث (مكالمة)";
                    alertMsg.style.color = "var(--accent-green)";
                    alertMsg.innerText = "الميكروفون مفعل بنجاح ومفتوح للتواصل الصوتي الحي!";
                })
                .catch(function(error) {
                    alert("تعذر الوصول للميكروفون. تأكد من منح الصلاحيات للمتصفح.");
                });
            } else {
                micActiveState = false;
                micBtn.classList.remove('live-recording');
                micBtn.innerText = "🎙️ صوت ميكروفون";
                alertMsg.style.color = "var(--text-gray)";
                alertMsg.innerText = "تم إغلاق الميكروفون وإنهاء الاتصال الصوتي.";
            }
        }
    </script>

</body>
</html>
