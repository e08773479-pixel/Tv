<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Game - Ultimate Club</title>
    <style>
        :root {
            --bg-dark: #020408;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.9);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.9);
            --cyan: #00f0ff;
            --pink: #ff007f;
            --text-main: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-viewport {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.98) 0%, rgba(5, 11, 20, 0.99) 100%);
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.4), inset 0 0 35px rgba(0, 240, 255, 0.2);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 35px;
        }

        /* شريط القمة: اسم النادي والعملات */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .club-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .coins-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid var(--gold);
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--gold);
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* محتوى الصفحة الرئيسي (الخيارات) */
        .main-content {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 15px 0;
        }

        .menu-card {
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.9) 0%, rgba(20, 40, 65, 0.95) 100%);
            border: 2px solid rgba(0, 255, 136, 0.4);
            border-radius: 20px;
            height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s ease;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            padding: 20px;
            text-align: center;
        }

        .menu-card:hover {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2) 0%, rgba(13, 27, 42, 0.95) 100%);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
            transform: translateY(-5px);
        }

        .card-icon {
            font-size: 55px;
            filter: drop-shadow(0 0 15px var(--cyan));
        }

        .card-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
        }

        .card-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
        }

        /* شريط التذييل (زر الرجوع) */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            padding: 8px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .back-btn:hover {
            background: var(--cyan);
            color: #020408;
            box-shadow: 0 0 20px var(--cyan);
        }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="top-bar">
            <div id="clubHeaderName" class="club-title">🏟️ نادي: جاري التحميل...</div>
            <div class="coins-container">
                <span>🪙</span>
                <span id="playerCoins">1000</span>
            </div>
        </div>

        <div class="main-content">
            <a href="store.html" class="menu-card">
                <div class="card-icon">🎁</div>
                <div class="card-title">متجر الباكيدجات</div>
                <div class="card-desc">افتح الباكيدجات واشترِ لاعبين أساطير لتعزيز قوة ناديك!</div>
            </a>

            <a href="squad.html" class="menu-card">
                <div class="card-icon">📋</div>
                <div class="card-title">تشكيلة النادي</div>
                <div class="card-desc">إدارة لاعبيك، وضع التشكيلة الأساسية، ودخول الميركاتو.</div>
            </a>

            <a href="matches.html" class="menu-card">
                <div class="card-icon">⚽</div>
                <div class="card-title">المباريات والدوري</div>
                <div class="card-desc">نافس الأندية الأخرى، العب مباريات حماسية واكسب العملات!</div>
            </a>
        </div>

        <div class="bottom-bar">
            <a href="game6.html" class="back-btn">← تغيير النادي</a>
            <div style="font-size: 13px; color: rgba(255,255,255,0.5);">Joker Ultimate Team © 2026</div>
        </div>
    </div>

    <script>
        // عرض اسم الفريق المختار من الـ LocalStorage
        const selectedTeam = localStorage.getItem('selectedTeam') || 'الفريق الأسطوري';
        document.getElementById('clubHeaderName').innerText = "🏟️ نادي: " + selectedTeam;

        // إدارة رصيد العملات الافتراضي (يبدأ بـ 1000 عملة لو أول مرة)
        if (!localStorage.getItem('userCoins')) {
            localStorage.setItem('userCoins', '1000');
        }
        document.getElementById('playerCoins').innerText = localStorage.getItem('userCoins');
    </script>

</body>
</html>
